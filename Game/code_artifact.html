<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>台式復古懷舊打彈珠台</title>
  
  <!-- HTTP 安全標頭與 CSP 規範 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1b1622 0%, #09060b 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      color: #fff;
    }
    .digit-font {
      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
    }
    .retro-cabinet {
      background: linear-gradient(135deg, #741e15 0%, #46110a 50%, #2e0804 100%);
      box-shadow: 
        0 0 0 6px #1a0301,
        0 0 0 10px #b24522,
        0 12px 35px rgba(0, 0, 0, 0.9),
        inset 0 2px 10px rgba(255, 200, 100, 0.35);
      border-radius: 24px;
      padding: 16px;
      width: 100%;
      max-width: 490px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(139, 0, 0, 0.6);
      padding-bottom: 8px;
    }
    .header-title {
      font-size: 1.1rem;
      font-weight: 900;
      color: #ffd152;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-sound {
      background: #3e140d;
      color: #ffdda1;
      border: 1px solid #c97d3e;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .odd-card {
      transition: all 0.08s ease-out;
      background: #1c1815;
      border: 2px solid #5a4832;
      color: #8395a7;
      text-shadow: 0 0 2px rgba(0,0,0,0.8);
      border-radius: 8px;
      padding: 8px 2px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 900;
    }
    .odd-card.active {
      background: radial-gradient(circle, #fff9b0 0%, #f39c12 90%);
      color: #8b0000;
      border-color: #ffffff;
      box-shadow: 0 0 18px #f1c40f, inset 0 0 8px #ffffff;
      transform: scale(1.06);
    }
    .odd-card.locked {
      background: radial-gradient(circle, #ff6b6b 0%, #c0392b 90%);
      color: #fff;
      border-color: #ffeaa7;
      box-shadow: 0 0 22px #ff4757, inset 0 0 10px #ffffff;
      animation: pulse-odd 0.8s infinite alternate;
    }
    @keyframes pulse-odd {
      from { filter: brightness(1); transform: scale(1.03); }
      to { filter: brightness(1.25); transform: scale(1.07); }
    }
    .led-display {
      background: #080d08;
      border: 2px solid #204020;
      box-shadow: inset 0 0 10px rgba(0, 255, 100, 0.2);
      color: #00ff66;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.7);
      border-radius: 8px;
      padding: 6px;
      text-align: center;
      flex: 1;
    }
    .dashboard {
      display: flex;
      gap: 8px;
    }
    .btn-action {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 900;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
    .btn-action:active { transform: translateY(1px); }
    .btn-coin {
      background: linear-gradient(to bottom, #f59e0b, #d97706);
      color: #111;
      box-shadow: 0 4px 0 #92400e;
    }
    .btn-shoot {
      background: linear-gradient(to bottom, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 0 #065f46;
    }
    .btn-shoot:disabled, .btn-coin:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    #power-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
      transition: width 0.05s ease-out;
    }
  </style>
</head>

<body>

<main class="retro-cabinet">
  <header class="header-bar">
    <div class="header-title">★ 夜市傳統打彈珠台 ★</div>
    <button type="button" id="btn-sound-toggle" class="btn-sound" aria-label="切換音效">🔊 音效: 開</button>
  </header>

  <!-- 跑馬燈區塊：調整為 2X(4軌), 4X(3軌), 6X(2軌), 8X(1軌), 10X(1軌) -->
  <section style="background: rgba(0,0,0,0.85); padding: 10px; border-radius: 10px; border: 2px solid rgba(245,158,11,0.7);">
    <div style="font-size: 0.75rem; color: #fbd38d; margin-bottom: 6px; display: flex; justify-content: space-between;">
      <span>● 押注倍率跑馬燈</span>
      <span id="win-slots-count-hint" style="color: #6ee7b7;">目前狀態：尚未投幣</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;" id="marquee-grid">
      <div class="odd-card" data-mult="2" data-wins="4">2X<span style="display:block; font-size: 10px; font-weight: normal;">(4軌)</span></div>
      <div class="odd-card" data-mult="4" data-wins="3">4X<span style="display:block; font-size: 10px; font-weight: normal;">(3軌)</span></div>
      <div class="odd-card" data-mult="6" data-wins="2">6X<span style="display:block; font-size: 10px; font-weight: normal;">(2軌)</span></div>
      <div class="odd-card" data-mult="8" data-wins="1">8X<span style="display:block; font-size: 10px; font-weight: normal;">(1軌)</span></div>
      <div class="odd-card" data-mult="10" data-wins="1">10X<span style="display:block; font-size: 10px; font-weight: normal;">(1軌)</span></div>
    </div>
  </section>

  <!-- 狀態儀表板 -->
  <section class="dashboard">
    <div class="led-display">
      <div style="font-size: 10px; color: #34d399;">彈珠存量</div>
      <div id="disp-credits" class="digit-font" style="font-size: 1.4rem;">30</div>
    </div>
    <div class="led-display" style="border-color: #d97706; color: #fbbf24;">
      <div style="font-size: 10px; color: #fbbf24;">本局押注</div>
      <div id="disp-bet" class="digit-font" style="font-size: 1.4rem;">0</div>
    </div>
    <div class="led-display" style="border-color: #dc2626; color: #f87171;">
      <div style="font-size: 10px; color: #f87171;">鎖定倍數</div>
      <div id="disp-multiplier" class="digit-font" style="font-size: 1.4rem; color: #fde047;">-</div>
    </div>
  </section>

  <!-- 畫布核心 -->
  <div style="position: relative; width: 100%; border-radius: 16px; overflow: hidden; border: 4px solid #b45309; background: #0d161d;">
    <canvas id="pinball-canvas" width="460" height="540" style="width: 100%; display: block;"></canvas>
    <div id="jackpot-overlay" style="display:none; position: absolute; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; flex-direction: column;">
      <div style="padding: 16px 28px; background: linear-gradient(45deg, #dc2626, #f59e0b); border: 3px solid #fef08a; border-radius: 16px; text-align: center;">
        <div style="font-size: 1.4rem; font-weight: 900;">恭喜中獎！</div>
        <div id="jackpot-win-text" class="digit-font" style="font-size: 1.8rem; font-weight: 900; margin-top: 4px;">+30 顆</div>
      </div>
    </div>
  </div>

  <!-- 操作面板 -->
  <footer style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 8px;">
      <span style="font-size: 12px; color: #fde68a;">蓄力:</span>
      <div style="flex: 1; height: 12px; background: #27272a; border-radius: 999px; overflow: hidden; padding: 2px;">
        <div id="power-bar-fill"></div>
      </div>
      <span id="power-pct" class="digit-font" style="font-size: 11px; color: #fbbf24; width: 36px; text-align: right;">0%</span>
    </div>

    <div style="display: flex; gap: 8px;">
      <button type="button" id="btn-insert-coin" class="btn-action btn-coin">🪙 投幣 (+1)</button>
      <button type="button" id="btn-shoot" disabled class="btn-action btn-shoot">🚀 按住蓄力彈射</button>
    </div>

    <div style="display: flex; justify-content: space-between; font-size: 11px; color: #d4d4d8; padding: 0 4px;">
      <span id="game-status-hint">提示：投幣抽出倍率後，長按拉桿蓄力彈射</span>
      <button type="button" id="btn-free-coin" style="background:none; border:none; color: #facc15; text-decoration: underline; cursor: pointer;">免費補幣+20</button>
    </div>
  </footer>
</main>

<script>
'use strict';

/**
 * XSS 防護跳脫函式
 */
function escapeHTML(str) {
  if (typeof str !== 'string') return String(str);
  return str.replace(/[&<>"'/`]/g, (match) => {
    const entities = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#x27;',
      '/': '&#x2F;',
      '`': '&#x60;'
    };
    return entities[match];
  });
}

class SoundController {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playCoin() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc1 = this.ctx.createOscillator();
      const osc2 = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc1.type = 'sine';
      osc2.type = 'triangle';
      osc1.frequency.setValueAtTime(987.77, t);
      osc1.frequency.setValueAtTime(1318.51, t + 0.07);
      osc2.frequency.setValueAtTime(1975.53, t);

      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(this.ctx.destination);

      osc1.start(t);
      osc2.start(t);
      osc1.stop(t + 0.35);
      osc2.stop(t + 0.35);
    } catch (_) {}
  }
  playBeep(freq = 700) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.04, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.045);
    } catch (_) {}
  }
  playPinHit(speedRatio = 1) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1500 + Math.random() * 800, t);
      osc.frequency.exponentialRampToValueAtTime(750, t + 0.04);

      const volume = Math.min(0.12, 0.02 + speedRatio * 0.08);
      gain.gain.setValueAtTime(volume, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.04);
    } catch (_) {}
  }
  playSpringRelease() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, t);
      osc.frequency.linearRampToValueAtTime(60, t + 0.12);
      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.15);
    } catch (_) {}
  }
  playJackpot() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
    notes.forEach((freq, idx) => {
      setTimeout(() => {
        if (!this.enabled || !this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.08, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.2);
        } catch (_) {}
      }, idx * 70);
    });
  }
  playLose() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(280, t);
      osc.frequency.linearRampToValueAtTime(110, t + 0.3);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.32);
    } catch (_) {}
  }
}
const sound = new SoundController();

const STATE = {
  credits: 30,
  bet: 0,
  currentMult: 0,
  winSlotCount: 0,
  winSlotIndices: new Set(),
  isRolling: false,
  ballState: 'IDLE',
  power: 0,
  powerDirection: 1,
  powerTimer: null,
  neonBlinkTimer: 0
};

const canvas = document.getElementById('pinball-canvas');
const ctx = canvas.getContext('2d');
const CW = canvas.width;
const CH = canvas.height;

// 彈珠與邊界設定
const SHOOTER_LANE_X = 416;
const BALL_R = 10.5; // 加大 50%
const PIN_R = 3.6;
const GRAVITY = 0.168;
const PIN_BOUNCE = 0.704;
const WALL_BOUNCE = 0.624;

// 均分 12 球軌
const TOTAL_SLOTS = 12;
const SLOTS_START_X = 12;
const SLOTS_TOTAL_WIDTH = SHOOTER_LANE_X - SLOTS_START_X;
const SLOT_W = SLOTS_TOTAL_WIDTH / TOTAL_SLOTS;
const SLOTS_TOP_Y = CH - 85;

const slots = [];
for (let i = 0; i < TOTAL_SLOTS; i++) {
  slots.push({
    index: i,
    x: SLOTS_START_X + i * SLOT_W,
    w: SLOT_W,
    isWin: false
  });
}

// 釘陣配置
const pins = [];

// 1. 上半部交錯主釘板
const ROWS = 8;
const ROW_START_Y = 120;
const ROW_SPACING = 30;
for (let r = 0; r < ROWS; r++) {
  const isOdd = r % 2 === 1;
  const count = isOdd ? 10 : 11;
  const spacing = (SHOOTER_LANE_X - 50) / 10;
  const offsetX = isOdd ? 30 + spacing * 0.5 : 30;
  for (let c = 0; c < count; c++) {
    const px = offsetX + c * spacing;
    if (px < SHOOTER_LANE_X - 18 && px > 20) {
      pins.push({ x: px, y: ROW_START_Y + r * ROW_SPACING, r: PIN_R, type: 'normal' });
    }
  }
}

// 2. 球道上方倒三角導向釘（通道皆 >= 24px）
for (let i = 0; i <= TOTAL_SLOTS; i++) {
  const divX = SLOTS_START_X + i * SLOT_W;
  pins.push({ x: divX, y: SLOTS_TOP_Y - 2, r: PIN_R + 0.5, type: 'divider-top' });

  if (i < TOTAL_SLOTS) {
    pins.push({ x: divX + SLOT_W * 0.5, y: SLOTS_TOP_Y - 30, r: PIN_R + 0.2, type: 'slot-funnel' });
    if (i % 2 === 0) {
      pins.push({ x: divX + SLOT_W, y: SLOTS_TOP_Y - 56, r: PIN_R, type: 'slot-funnel' });
    }
  }
}

// 彈珠初始狀態
const ball = {
  x: SHOOTER_LANE_X + 21,
  y: CH - 45,
  vx: 0,
  vy: 0,
  inShooterLane: true,
  trail: []
};

const domCredits = document.getElementById('disp-credits');
const domBet = document.getElementById('disp-bet');
const domMultiplier = document.getElementById('disp-multiplier');
const domWinHint = document.getElementById('win-slots-count-hint');
const domStatusHint = document.getElementById('game-status-hint');
const domPowerBar = document.getElementById('power-bar-fill');
const domPowerPct = document.getElementById('power-pct');
const btnInsert = document.getElementById('btn-insert-coin');
const btnShoot = document.getElementById('btn-shoot');
const btnFreeCoin = document.getElementById('btn-free-coin');
const btnSoundToggle = document.getElementById('btn-sound-toggle');
const marqueeCards = Array.from(document.querySelectorAll('.odd-card'));
const jackpotOverlay = document.getElementById('jackpot-overlay');
const jackpotWinText = document.getElementById('jackpot-win-text');

function updateWinHint(mult, winsCount) {
  while (domWinHint.firstChild) {
    domWinHint.removeChild(domWinHint.firstChild);
  }
  const t1 = document.createTextNode('已鎖定 ');
  const s1 = document.createElement('span');
  s1.style.color = '#fde047';
  s1.style.fontWeight = 'bold';
  s1.textContent = `${escapeHTML(String(mult))}X`;

  const t2 = document.createTextNode(' (中獎: ');
  const s2 = document.createElement('span');
  s2.style.color = '#fde047';
  s2.style.fontWeight = 'bold';
  s2.textContent = `${escapeHTML(String(winsCount))} 軌)`;

  domWinHint.append(t1, s1, t2, s2);
}

function calculateWinSlots(mult, winsCount) {
  STATE.winSlotCount = winsCount;
  STATE.winSlotIndices.clear();

  const allIndices = Array.from({ length: TOTAL_SLOTS }, (_, i) => i);
  for (let i = allIndices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allIndices[i], allIndices[j]] = [allIndices[j], allIndices[i]];
  }

  const selected = allIndices.slice(0, winsCount);
  selected.forEach(idx => STATE.winSlotIndices.add(idx));

  slots.forEach((slot, i) => {
    slot.isWin = STATE.winSlotIndices.has(i);
  });

  updateWinHint(mult, winsCount);
}

function runMarquee(onComplete) {
  STATE.isRolling = true;
  btnInsert.disabled = true;
  btnShoot.disabled = true;

  marqueeCards.forEach(c => c.classList.remove('active', 'locked'));

  let currentIdx = Math.floor(Math.random() * marqueeCards.length);
  let speed = 40;
  const totalSteps = 25 + Math.floor(Math.random() * 15);
  let step = 0;

  function tick() {
    marqueeCards.forEach(c => c.classList.remove('active'));
    currentIdx = (currentIdx + 1) % marqueeCards.length;
    marqueeCards[currentIdx].classList.add('active');

    sound.playBeep(650 + currentIdx * 70);
    step++;

    if (step < totalSteps) {
      if (totalSteps - step < 8) speed += 30;
      setTimeout(tick, speed);
    } else {
      STATE.isRolling = false;
      const targetCard = marqueeCards[currentIdx];
      targetCard.classList.remove('active');
      targetCard.classList.add('locked');

      const mult = parseInt(targetCard.dataset.mult, 10);
      const wins = parseInt(targetCard.dataset.wins, 10);
      STATE.currentMult = mult;
      domMultiplier.textContent = `${mult}X`;

      calculateWinSlots(mult, wins);

      btnInsert.disabled = false;
      btnShoot.disabled = false;
      sound.playCoin();

      if (onComplete) onComplete();
    }
  }
  tick();
}

function prepareBallForLaunch() {
  if (STATE.ballState !== 'PLAYING') {
    STATE.ballState = 'READY_IN_SHOOTER';
    ball.x = SHOOTER_LANE_X + 21;
    ball.y = CH - 45;
    ball.vx = 0;
    ball.vy = 0;
    ball.inShooterLane = true;
    ball.trail = [];
    btnShoot.disabled = false;
    domStatusHint.textContent = '長按按鈕蓄力彈射！';
  }
}

btnInsert.addEventListener('click', () => {
  if (STATE.isRolling || STATE.ballState === 'PLAYING') return;
  if (STATE.credits <= 0) return;

  STATE.credits--;
  STATE.bet++;
  domCredits.textContent = String(STATE.credits);
  domBet.textContent = String(STATE.bet);
  sound.playCoin();

  if (STATE.bet === 1) {
    runMarquee(() => {
      prepareBallForLaunch();
    });
  } else {
    prepareBallForLaunch();
  }
});

btnFreeCoin.addEventListener('click', () => {
  STATE.credits += 20;
  domCredits.textContent = String(STATE.credits);
  sound.playCoin();
});

btnSoundToggle.addEventListener('click', () => {
  sound.enabled = !sound.enabled;
  btnSoundToggle.textContent = sound.enabled ? '🔊 音效: 開' : '🔇 音效: 關';
});

function startCharging(e) {
  if (e && e.cancelable) e.preventDefault();
  if (STATE.ballState !== 'READY_IN_SHOOTER' || STATE.isRolling || STATE.bet === 0) return;
  sound.init();

  STATE.ballState = 'CHARGING';
  STATE.power = 5;
  STATE.powerDirection = 1;

  if (STATE.powerTimer) clearInterval(STATE.powerTimer);
  STATE.powerTimer = setInterval(() => {
    STATE.power += 3.6 * STATE.powerDirection;
    if (STATE.power >= 100) {
      STATE.power = 100;
      STATE.powerDirection = -1;
    } else if (STATE.power <= 15) {
      STATE.power = 15;
      STATE.powerDirection = 1;
    }
    const val = Math.min(100, Math.max(0, Math.round(STATE.power)));
    domPowerBar.style.width = `${val}%`;
    domPowerPct.textContent = `${val}%`;
  }, 22);
}

function releaseAndLaunch() {
  if (STATE.ballState !== 'CHARGING') return;
  clearInterval(STATE.powerTimer);
  STATE.powerTimer = null;

  const launchForce = STATE.power;
  STATE.power = 0;
  domPowerBar.style.width = '0%';
  domPowerPct.textContent = '0%';

  STATE.ballState = 'PLAYING';
  btnShoot.disabled = true;
  btnInsert.disabled = true;

  const launchSpeed = (13.5 + (launchForce / 100) * 8.6) * 0.82;
  ball.vy = -launchSpeed;
  ball.vx = (Math.random() - 0.5) * 0.25;
  ball.inShooterLane = true;

  sound.playSpringRelease();
}

btnShoot.addEventListener('pointerdown', startCharging);
window.addEventListener('pointerup', releaseAndLaunch);

function updatePhysics() {
  if (STATE.ballState !== 'PLAYING') return;

  ball.trail.push({ x: ball.x, y: ball.y });
  if (ball.trail.length > 5) ball.trail.shift();

  ball.vy += GRAVITY;
  ball.x += ball.vx;
  ball.y += ball.vy;

  // 1. 發射道物理
  if (ball.inShooterLane) {
    if (ball.x + BALL_R > CW - 5) {
      ball.x = CW - 5 - BALL_R;
      ball.vx = -Math.abs(ball.vx) * WALL_BOUNCE;
    }
    if (ball.x - BALL_R < SHOOTER_LANE_X && ball.y > 88) {
      ball.x = SHOOTER_LANE_X + BALL_R;
      ball.vx = Math.abs(ball.vx) * WALL_BOUNCE;
    }

    if (ball.y < 75) {
      ball.inShooterLane = false;
      ball.vx = (-5.6 - Math.random() * 2.8) * 0.8;
      ball.vy = Math.min(ball.vy, -1.2);
      sound.playPinHit(1.2);
      return;
    }

    // 發射力道過輕回落重置
    if (ball.vy > 0 && ball.y >= CH - 45) {
      ball.y = CH - 45;
      ball.vy = -ball.vy * 0.25;
      if (Math.abs(ball.vy) < 0.8) {
        ball.vy = 0;
        ball.vx = 0;
        STATE.ballState = 'READY_IN_SHOOTER';
        btnShoot.disabled = false;
        btnInsert.disabled = false;
        domStatusHint.textContent = '⚠️ 發射力道過輕，請重新蓄力彈射！';
        return;
      }
    }
    return;
  }

  // 2. 邊界碰撞
  if (ball.y - BALL_R < 10) {
    ball.y = 10 + BALL_R;
    ball.vy = Math.abs(ball.vy) * WALL_BOUNCE;
    sound.playPinHit(0.6);
  }
  if (ball.x - BALL_R < 12) {
    ball.x = 12 + BALL_R;
    ball.vx = Math.abs(ball.vx) * WALL_BOUNCE;
    sound.playPinHit(0.7);
  }
  if (ball.x + BALL_R > SHOOTER_LANE_X && ball.y > 85 && ball.y < SLOTS_TOP_Y) {
    ball.x = SHOOTER_LANE_X - BALL_R;
    ball.vx = -Math.abs(ball.vx) * WALL_BOUNCE;
    sound.playPinHit(0.7);
  }

  // 3. 釘子碰撞
  for (let i = 0; i < pins.length; i++) {
    const pin = pins[i];
    const dx = ball.x - pin.x;
    const dy = ball.y - pin.y;
    const dist = Math.hypot(dx, dy);
    const minDist = BALL_R + pin.r;

    if (dist < minDist) {
      const nx = dx / (dist || 1);
      const ny = dy / (dist || 1);
      const curSpeedAlongNormal = ball.vx * nx + ball.vy * ny;

      if (curSpeedAlongNormal < 0) {
        const restitution = pin.type === 'slot-funnel' ? 0.736 : PIN_BOUNCE;
        const impulse = -(1 + restitution) * curSpeedAlongNormal;
        ball.vx += nx * impulse;
        ball.vy += ny * impulse;

        if (Math.abs(ball.vx) < 0.25) {
          ball.vx += (Math.random() > 0.5 ? 0.45 : -0.45);
        }

        const overlap = minDist - dist + 0.4;
        ball.x += nx * overlap;
        ball.y += ny * overlap;

        const totalSpeed = Math.hypot(ball.vx, ball.vy);
        sound.playPinHit(totalSpeed / 8);
      }
    }
  }

  // 4. 球軌分隔木條碰撞
  for (let i = 0; i <= TOTAL_SLOTS; i++) {
    const divX = SLOTS_START_X + i * SLOT_W;
    if (ball.y > SLOTS_TOP_Y && ball.y < CH - 15) {
      if (Math.abs(ball.x - divX) < BALL_R + 1.2) {
        ball.vx = (ball.x > divX ? 1 : -1) * (Math.abs(ball.vx) * 0.52 + 0.6);
        ball.x = ball.x > divX ? divX + BALL_R + 1.3 : divX - (BALL_R + 1.3);
        sound.playPinHit(0.5);
      }
    }
  }

  // 5. 軌道沉入判定
  if (ball.y >= CH - 36) {
    const relativeX = ball.x - SLOTS_START_X;
    let slotIdx = Math.floor(relativeX / SLOT_W);
    slotIdx = Math.max(0, Math.min(TOTAL_SLOTS - 1, slotIdx));
    settleRound(slotIdx);
  }

  if (ball.y > CH + 10 || (ball.y > SLOTS_TOP_Y && ball.x > SHOOTER_LANE_X + 2)) {
    settleRound(null);
  }
}

function settleRound(landedSlotIdx) {
  STATE.ballState = 'SETTLING';

  if (landedSlotIdx !== null && slots[landedSlotIdx]) {
    const targetSlot = slots[landedSlotIdx];
    if (targetSlot.isWin) {
      const winAmount = STATE.bet * STATE.currentMult;
      STATE.credits += winAmount;
      sound.playJackpot();

      jackpotWinText.textContent = `+${escapeHTML(String(winAmount))} 顆！(${escapeHTML(String(STATE.currentMult))}X)`;
      jackpotOverlay.style.display = 'flex';

      setTimeout(() => {
        jackpotOverlay.style.display = 'none';
      }, 1900);
    } else {
      sound.playLose();
    }
  }

  domCredits.textContent = String(STATE.credits);
  STATE.bet = 0;
  domBet.textContent = '0';

  setTimeout(() => {
    STATE.ballState = 'IDLE';
    btnInsert.disabled = false;
    btnShoot.disabled = true;

    marqueeCards.forEach(c => c.classList.remove('locked', 'active'));
    domMultiplier.textContent = '-';
    domWinHint.textContent = '目前狀態：尚未投幣';
    domStatusHint.textContent = '提示：請先投幣以抽選倍率';
    slots.forEach(s => s.isWin = false);

    ball.x = SHOOTER_LANE_X + 21;
    ball.y = CH - 45;
    ball.vx = 0;
    ball.vy = 0;
    ball.trail = [];
  }, 1200);
}

function render() {
  ctx.clearRect(0, 0, CW, CH);

  // 底盤背景
  const bgGrad = ctx.createRadialGradient(CW / 2, CH / 2 - 50, 20, CW / 2, CH / 2, 350);
  bgGrad.addColorStop(0, '#152433');
  bgGrad.addColorStop(1, '#0a1017');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, CW, CH);

  // 頂部導流弧
  ctx.strokeStyle = '#e67e22';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(SHOOTER_LANE_X - 10, 88, 86, Math.PI * 1.5, Math.PI * 2);
  ctx.stroke();

  // 發射道分隔板
  ctx.strokeStyle = '#c0392b';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(SHOOTER_LANE_X, 88);
  ctx.lineTo(SHOOTER_LANE_X, CH);
  ctx.stroke();

  // 繪製 12 個無縫等寬球道
  STATE.neonBlinkTimer += 0.05;
  const isBlinkOn = Math.sin(STATE.neonBlinkTimer * 5) > 0;

  for (let i = 0; i < TOTAL_SLOTS; i++) {
    const s = slots[i];
    const isWinSlot = s.isWin;

    ctx.fillStyle = isWinSlot ? (isBlinkOn ? 'rgba(0, 255, 136, 0.28)' : 'rgba(0, 200, 100, 0.16)') : 'rgba(20, 30, 40, 0.4)';
    ctx.fillRect(s.x, SLOTS_TOP_Y, s.w, CH - SLOTS_TOP_Y);

    ctx.strokeStyle = '#ecf0f1';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x, SLOTS_TOP_Y);
    ctx.lineTo(s.x, CH - 10);
    ctx.stroke();

    const lampX = s.x + s.w / 2;
    const lampY = CH - 22;

    ctx.beginPath();
    ctx.arc(lampX, lampY, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = isWinSlot ? (isBlinkOn ? '#00ff88' : '#00aa55') : '#4a1515';
    ctx.fill();

    ctx.fillStyle = isWinSlot ? (isBlinkOn ? '#ffffff' : '#f1c40f') : '#8fa0a8';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(isWinSlot ? '★中' : `${i + 1}`, lampX, SLOTS_TOP_Y + 16);
  }

  // 封閉最後一道分隔線
  const lastX = SLOTS_START_X + TOTAL_SLOTS * SLOT_W;
  ctx.beginPath();
  ctx.moveTo(lastX, SLOTS_TOP_Y);
  ctx.lineTo(lastX, CH - 10);
  ctx.stroke();

  // 繪製釘子
  pins.forEach(pin => {
    ctx.save();
    ctx.beginPath();
    ctx.arc(pin.x, pin.y, pin.r, 0, Math.PI * 2);
    ctx.fillStyle = pin.type === 'slot-funnel' ? '#f39c12' : '#bdc3c7';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(pin.x - 1, pin.y - 1, pin.r * 0.45, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();
  });

  // 繪製拉桿彈簧
  const springBaseY = CH - 12;
  const springComp = STATE.ballState === 'CHARGING' ? (STATE.power / 100) * 26 : 0;
  ctx.strokeStyle = '#95a5a6';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(SHOOTER_LANE_X + 21, springBaseY);
  ctx.lineTo(SHOOTER_LANE_X + 21, CH - 32 + springComp);
  ctx.stroke();

  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(SHOOTER_LANE_X + 9, CH - 33 + springComp, 24, 6);

  // 鋼珠拖尾
  if (ball.trail.length > 1 && STATE.ballState === 'PLAYING') {
    ctx.save();
    for (let t = 0; t < ball.trail.length; t++) {
      const p = ball.trail[t];
      const alpha = ((t + 1) / ball.trail.length) * 0.35;
      ctx.beginPath();
      ctx.arc(p.x, p.y, BALL_R * 0.88, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220, 240, 255, ${alpha})`;
      ctx.fill();
    }
    ctx.restore();
  }

  // 繪製加大 50% 鋼珠
  ctx.save();
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  const ballGrad = ctx.createRadialGradient(
    ball.x - BALL_R * 0.35,
    ball.y - BALL_R * 0.35,
    BALL_R * 0.1,
    ball.x,
    ball.y,
    BALL_R
  );
  ballGrad.addColorStop(0, '#ffffff');
  ballGrad.addColorStop(0.3, '#e0e7ec');
  ballGrad.addColorStop(0.7, '#7f8c8d');
  ballGrad.addColorStop(1, '#2c3e50');

  ctx.fillStyle = ballGrad;
  ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
  ctx.shadowBlur = 7;
  ctx.shadowOffsetY = 3;
  ctx.fill();
  ctx.restore();

  updatePhysics();
  requestAnimationFrame(render);
}

// 啟動主渲染迴圈
requestAnimationFrame(render);
</script>
</body>
</html>
