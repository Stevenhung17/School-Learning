<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>天蠶變 - 無限挑戰版</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      touch-action: manipulation;
      overflow: hidden;
    }

    #ui {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #1e293b;
      padding: 8px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 900px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .stat-val { color: #38bdf8; }
    .score-val { color: #fbbf24; font-size: 16px; }
    .time-val { color: #34d399; font-size: 16px; }

    .btn-reset {
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #f87171;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-reset:hover { background: #ef4444; color: #fff; }

    #main-layout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 900px;
    }

    #game-container {
      position: relative;
      flex: 1;
      max-width: 750px;
      aspect-ratio: 3 / 2;
      background: #000;
      border: 3px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      text-align: center;
      padding: 16px;
    }
    .hidden { display: none !important; }

    #goodjob-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9;
      background: rgba(0, 0, 0, 0.15);
    }
    .btn-goodjob {
      padding: 16px 36px;
      font-size: 26px;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, #10b981, #059669);
      border: 3px solid #a7f3d0;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.7);
      animation: pulseBtn 1.2s infinite alternate;
    }
    @keyframes pulseBtn {
      from { transform: scale(1); }
      to { transform: scale(1.08); box-shadow: 0 0 35px rgba(16, 185, 129, 0.9); }
    }

    .btn-action {
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-action:hover { background: #1d4ed8; }

    .score-table {
      margin: 8px 0;
      font-size: 13px;
      color: #cbd5e1;
      text-align: left;
      border-collapse: collapse;
    }
    .score-table td { padding: 4px 8px; }

    #touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 50px);
      gap: 6px;
      touch-action: none;
    }
    .dpad-btn {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 10px;
      color: #f8fafc;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .dpad-btn:active, .dpad-btn.active {
      background: #2563eb;
      border-color: #60a5fa;
      transform: scale(0.94);
    }
    #btn-up    { grid-column: 2; grid-row: 1; }
    #btn-left  { grid-column: 1; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #btn-down  { grid-column: 2; grid-row: 3; }

    @media (hover: hover) and (pointer: fine) {
      #touch-controls {
        display: none !important;
      }
    }

    @media (max-aspect-ratio: 1/1) {
      #main-layout {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div id="ui">
    <div>總分: <span id="score-text" class="score-val">0</span></div>
    <div>時間: <span id="time-text" class="time-val">90s</span></div>
    <div>關卡: <span id="level-text" class="stat-val">1</span></div>
    <div>進度: <span id="progress-text" class="stat-val">0%</span></div>
    <div>目標: <span id="target-text" class="stat-val">75%</span></div>
    <button id="restart-game-btn" class="btn-reset">🔄 重新開始 (第1關)</button>
  </div>

  <div id="main-layout">
    <div id="game-container">
      <canvas id="gameCanvas" width="600" height="400"></canvas>
      
      <div id="goodjob-layer" class="hidden">
        <button id="goodjob-btn" class="btn-goodjob">Good Job! 👍</button>
      </div>

      <div id="overlay" class="overlay-modal">
        <h2 id="overlay-title">準備開始</h2>
        <div id="overlay-desc" style="color: #94a3b8; font-size: 14px;"></div>
        <div id="overlay-extra"></div>
        <button id="overlay-btn" class="btn-action">開始挑戰</button>
      </div>
    </div>

    <div id="touch-controls">
      <button id="btn-up" class="dpad-btn">▲</button>
      <button id="btn-left" class="dpad-btn">◀</button>
      <button id="btn-right" class="dpad-btn">▶</button>
      <button id="btn-down" class="dpad-btn">▼</button>
    </div>
  </div>

  <script>
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.isWakaPlaying = false;
        this.wakaTimer = null;
        this.wakaStep = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      startWaka() {
        if (!this.ctx || this.isWakaPlaying) return;
        this.isWakaPlaying = true;
        
        const playTone = () => {
          if (!this.isWakaPlaying) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          
          osc.type = 'triangle';
          const isHigh = this.wakaStep % 2 === 0;
          const startFreq = isHigh ? 480 : 330;
          const endFreq = isHigh ? 260 : 180;
          
          const now = this.ctx.currentTime;
          osc.frequency.setValueAtTime(startFreq, now);
          osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.12);

          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.13);

          this.wakaStep++;
          this.wakaTimer = setTimeout(playTone, 140);
        };

        playTone();
      }

      stopWaka() {
        this.isWakaPlaying = false;
        if (this.wakaTimer) {
          clearTimeout(this.wakaTimer);
          this.wakaTimer = null;
        }
      }

      playClear() {
        if (!this.ctx) return;
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
          
          gain.gain.setValueAtTime(0, this.ctx.currentTime + idx * 0.1);
          gain.gain.linearRampToValueAtTime(0.25, this.ctx.currentTime + idx * 0.1 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.1 + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.1);
          osc.stop(this.ctx.currentTime + idx * 0.1 + 0.4);
        });
      }

      playGameOver() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        
        const now = this.ctx.currentTime;
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.4);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    const sound = new SoundEngine();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreText = document.getElementById('score-text');
    const timeText = document.getElementById('time-text');
    const levelText = document.getElementById('level-text');
    const progressText = document.getElementById('progress-text');
    const targetText = document.getElementById('target-text');
    const restartGameBtn = document.getElementById('restart-game-btn');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const overlayExtra = document.getElementById('overlay-extra');
    const overlayBtn = document.getElementById('overlay-btn');
    const goodjobLayer = document.getElementById('goodjob-layer');
    const goodjobBtn = document.getElementById('goodjob-btn');

    const STAGES_BASE = [
      {
        level: 1, target: 75, timeLimit: 90, label: "第 1 關",
        enemies: [{ type: 'linear', speed: 0.5, radius: 6, color: '#ef4444' }]
      },
      {
        level: 2, target: 80, timeLimit: 90, label: "第 2 關",
        enemies: [{ type: 'jitter', speed: 0.6, radius: 6, color: '#f97316' }]
      },
      {
        level: 3, target: 80, timeLimit: 90, label: "第 3 關",
        enemies: [
          { type: 'linear', speed: 0.55, radius: 6, color: '#ef4444' },
          { type: 'linear', speed: 0.55, radius: 6, color: '#ef4444' }
        ]
      },
      {
        level: 4, target: 90, timeLimit: 100, label: "第 4 關",
        enemies: [{ type: 'hunter', speed: 0.55, radius: 6.5, color: '#ec4899' }]
      },
      {
        level: 5, target: 90, timeLimit: 100, label: "第 5 關",
        enemies: [
          { type: 'linear', speed: 0.35, radius: 10, color: '#a855f7' },
          { type: 'jitter', speed: 0.85, radius: 3.5, color: '#eab308' }
        ]
      },
      {
        level: 6, target: 95, timeLimit: 120, label: "第 6 關",
        enemies: [
          { type: 'linear', speed: 0.6, radius: 6, color: '#ef4444' },
          { type: 'jitter', speed: 0.65, radius: 5, color: '#f97316' },
          { type: 'hunter', speed: 0.55, radius: 6, color: '#ec4899' }
        ]
      }
    ];

    function getStageConfig(stageIdx) {
      if (stageIdx < STAGES_BASE.length) {
        return STAGES_BASE[stageIdx];
      }

      const stageNum = stageIdx + 1;
      const extraLvl = stageNum - 6;
      
      const enemyCount = Math.min(6, 3 + Math.floor(extraLvl / 2));
      const speedScale = 1 + Math.min(0.55, extraLvl * 0.035);

      const generatedEnemies = [];
      for (let i = 0; i < enemyCount; i++) {
        const roll = Math.random();
        if (roll < 0.3) {
          generatedEnemies.push({ type: 'hunter', speed: 0.55 * speedScale, radius: 6.5, color: '#ec4899' });
        } else if (roll < 0.55) {
          generatedEnemies.push({ type: 'jitter', speed: 0.65 * speedScale, radius: 5, color: '#f97316' });
        } else if (roll < 0.75) {
          generatedEnemies.push({ type: 'speedy', speed: 0.85 * speedScale, radius: 3.5, color: '#eab308' });
        } else if (roll < 0.88) {
          generatedEnemies.push({ type: 'giant', speed: 0.35 * speedScale, radius: 9.5, color: '#a855f7' });
        } else {
          generatedEnemies.push({ type: 'linear', speed: 0.6 * speedScale, radius: 6, color: '#ef4444' });
        }
      }

      return {
        level: stageNum,
        target: 95,
        timeLimit: Math.min(150, 120 + extraLvl * 3),
        label: `第 ${stageNum} 關 (無限挑戰)`,
        enemies: generatedEnemies
      };
    }

    const CELL_SIZE = 5;
    const COLS = canvas.width / CELL_SIZE;  // 120
    const ROWS = canvas.height / CELL_SIZE; // 80
    const TOTAL_CELLS = COLS * ROWS;

    const UNCLAIMED = 0;
    const CLAIMED = 1;
    const TRAIL = 2;

    let currentStageIndex = 0;
    let currentStageConfig = null;
    let grid = [];
    let trailCells = [];
    let enemies = [];
    let currentPct = 0;

    let gameState = 'START';
    let totalScore = 0;
    let stageAreaScore = 0;
    let timeLeft = 0;
    let lastTimestamp = 0;

    const bgImage = new Image();
    bgImage.crossOrigin = 'anonymous';

    const player = {
      x: 0,
      y: 0,
      isDrawing: false,
      angle: 0,
      isMoving: false,
      moveAccumulator: 0,
      speed: 0.8 // 調慢 20% (原速為 1.0)
    };

    function loadRandomBackground() {
      const seed = Math.floor(Math.random() * 100000);
      bgImage.src = `https://picsum.photos/seed/${seed}/600/400`;
    }

    function initStage(stageIdx) {
      currentStageIndex = stageIdx;
      currentStageConfig = getStageConfig(currentStageIndex);

      levelText.textContent = currentStageConfig.label;
      targetText.textContent = `${currentStageConfig.target}%`;
      timeLeft = currentStageConfig.timeLimit;
      stageAreaScore = 0;
      updateDisplayScore();

      grid = [];
      for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
          grid[r][c] = (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) ? CLAIMED : UNCLAIMED;
        }
      }

      player.x = 0;
      player.y = 0;
      player.isDrawing = false;
      player.angle = 0;
      player.isMoving = false;
      player.moveAccumulator = 0;
      trailCells = [];

      enemies = currentStageConfig.enemies.map((cfg, i) => {
        const angle = (i / currentStageConfig.enemies.length) * Math.PI * 2 + 0.4;
        return {
          x: COLS / 2 + Math.cos(angle) * 8,
          y: ROWS / 2 + Math.sin(angle) * 8,
          vx: Math.cos(angle) * cfg.speed,
          vy: Math.sin(angle) * cfg.speed,
          baseSpeed: cfg.speed,
          type: cfg.type,
          radius: cfg.radius,
          color: cfg.color,
          timer: 0
        };
      });

      loadRandomBackground();
      calculateProgress(false);
      goodjobLayer.classList.add('hidden');
    }

    function updateDisplayScore() {
      scoreText.textContent = (totalScore + stageAreaScore).toLocaleString();
      timeText.textContent = `${Math.ceil(timeLeft)}s`;
    }

    function calculateProgress(checkWin = true) {
      let claimedCount = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] === CLAIMED) claimedCount++;
        }
      }
      currentPct = Math.floor((claimedCount / TOTAL_CELLS) * 100);
      progressText.textContent = currentPct + '%';

      if (checkWin && currentPct >= currentStageConfig.target && gameState === 'PLAYING') {
        triggerGoodJobPhase();
      }
      return claimedCount;
    }

    function triggerGoodJobPhase() {
      gameState = 'GOODJOB';
      sound.stopWaka();
      sound.playClear();
      goodjobLayer.classList.remove('hidden');
    }

    goodjobBtn.addEventListener('click', () => {
      goodjobLayer.classList.add('hidden');
      handleStageClearSummary();
    });

    function handleStageClearSummary() {
      gameState = 'CLEARED';

      const timeBonus = Math.floor(timeLeft) * 80;
      const overTargetBonus = Math.max(0, currentPct - currentStageConfig.target) * 300;
      const stageTotal = stageAreaScore + timeBonus + overTargetBonus;
      totalScore += stageTotal;

      const scoreBreakdownHTML = `
        <table class="score-table">
          <tr><td>佔領基礎分：</td><td><b>+${stageAreaScore.toLocaleString()}</b></td></tr>
          <tr><td>時間獎勵 (${Math.ceil(timeLeft)}s)：</td><td><b>+${timeBonus.toLocaleString()}</b></td></tr>
          <tr><td>超額獎勵 (${currentPct - currentStageConfig.target}%)：</td><td><b>+${overTargetBonus.toLocaleString()}</b></td></tr>
          <tr style="border-top: 1px solid #475569; color: #fbbf24;">
            <td>本關總計：</td><td><b>+${stageTotal.toLocaleString()}</b></td>
          </tr>
        </table>
      `;

      showOverlay(
        `🎉 ${currentStageConfig.label} 完美通關！`,
        `達成度 ${currentPct}%（目標 ${currentStageConfig.target}%）`,
        scoreBreakdownHTML,
        `進入第 ${currentStageIndex + 2} 關`,
        () => {
          initStage(currentStageIndex + 1);
          gameState = 'PLAYING';
        }
      );
    }

    function handleGameOver(reason) {
      gameState = 'GAMEOVER';
      sound.stopWaka();
      sound.playGameOver();
      showOverlay(
        "❌ 挑戰失敗",
        reason,
        `<div style="margin: 6px 0; color:#ef4444;">本關累積進度與分數已重置。</div>`,
        "重新挑戰本關",
        () => {
          initStage(currentStageIndex);
          gameState = 'PLAYING';
        }
      );
    }

    function showOverlay(title, desc, extraHtml, btnText, callback) {
      overlayTitle.textContent = title;
      overlayDesc.innerHTML = desc;
      overlayExtra.innerHTML = extraHtml || '';
      overlayBtn.textContent = btnText;
      overlay.classList.remove('hidden');

      overlayBtn.onclick = () => {
        sound.init();
        overlay.classList.add('hidden');
        callback();
      };
    }

    function restartEntireGame() {
      totalScore = 0;
      initStage(0);
      showOverlay(
        "天蠶變：無限挑戰",
        "使用方向鍵或觸控控制蜘蛛 🕷️ 劃線圈地。<br>第 7 關起進入無限模式，難度與敵人群將無止境增強！",
        "",
        "開始第 1 關",
        () => {
          gameState = 'PLAYING';
        }
      );
    }

    restartGameBtn.addEventListener('click', () => {
      sound.init();
      restartEntireGame();
    });

    function resolveCapture() {
      const prevClaimed = calculateProgress(false);

      for (const cell of trailCells) {
        grid[cell.r][cell.c] = CLAIMED;
      }
      trailCells = [];
      player.isDrawing = false;

      const visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
      const queue = [];

      for (const en of enemies) {
        const startR = Math.min(ROWS - 1, Math.max(0, Math.floor(en.y)));
        const startC = Math.min(COLS - 1, Math.max(0, Math.floor(en.x)));
        if (grid[startR][startC] === UNCLAIMED && !visited[startR][startC]) {
          visited[startR][startC] = true;
          queue.push([startR, startC]);
        }
      }

      const dr = [-1, 1, 0, 0];
      const dc = [0, 0, -1, 1];

      while (queue.length > 0) {
        const [cr, cc] = queue.shift();
        for (let i = 0; i < 4; i++) {
          const nr = cr + dr[i];
          const nc = cc + dc[i];
          if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
            if (!visited[nr][nc] && grid[nr][nc] === UNCLAIMED) {
              visited[nr][nc] = true;
              queue.push([nr, nc]);
            }
          }
        }
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] === UNCLAIMED && !visited[r][c]) {
            grid[r][c] = CLAIMED;
          }
        }
      }

      const newClaimed = calculateProgress(false);
      const deltaCells = newClaimed - prevClaimed;

      if (deltaCells > 0) {
        const captureRatio = deltaCells / TOTAL_CELLS;
        let earned = deltaCells * 10;
        if (captureRatio >= 0.05) earned = Math.floor(earned * 1.5);
        stageAreaScore += earned;
        updateDisplayScore();
      }

      calculateProgress(true);
    }

    const keys = {};
    window.addEventListener('keydown', (e) => {
      sound.init();
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
      keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    const bindTouchButton = (btnId, keyName) => {
      const btn = document.getElementById(btnId);
      const start = (e) => {
        e.preventDefault();
        sound.init();
        keys[keyName] = true;
        btn.classList.add('active');
      };
      const end = (e) => {
        e.preventDefault();
        keys[keyName] = false;
        btn.classList.remove('active');
      };

      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('touchcancel', end, { passive: false });
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
    };

    bindTouchButton('btn-up', 'arrowup');
    bindTouchButton('btn-down', 'arrowdown');
    bindTouchButton('btn-left', 'arrowleft');
    bindTouchButton('btn-right', 'arrowright');

    function updatePlayer() {
      if (gameState !== 'PLAYING') {
        sound.stopWaka();
        return;
      }

      let dx = 0, dy = 0;
      if (keys['arrowup'] || keys['w'])    { dy -= 1; player.angle = 0; }
      if (keys['arrowdown'] || keys['s'])  { dy += 1; player.angle = Math.PI; }
      if (keys['arrowleft'] || keys['a'])  { dx -= 1; player.angle = -Math.PI / 2; }
      if (keys['arrowright'] || keys['d']) { dx += 1; player.angle = Math.PI / 2; }

      if (dx !== 0 && dy !== 0) dy = 0;

      if (dx === 0 && dy === 0) {
        player.isMoving = false;
        sound.stopWaka();
        return;
      }

      player.isMoving = true;
      sound.startWaka();

      // 移動步長累積器 (使速度調慢 20%)
      player.moveAccumulator += player.speed;
      if (player.moveAccumulator < 1.0) {
        return;
      }
      player.moveAccumulator -= 1.0;

      const nextX = Math.min(COLS - 1, Math.max(0, player.x + dx));
      const nextY = Math.min(ROWS - 1, Math.max(0, player.y + dy));

      if (nextX === player.x && nextY === player.y) {
        return;
      }

      const targetCellState = grid[nextY][nextX];
      if (targetCellState === TRAIL) {
        return;
      }

      player.x = nextX;
      player.y = nextY;

      if (targetCellState === UNCLAIMED) {
        grid[nextY][nextX] = TRAIL;
        trailCells.push({ r: nextY, c: nextX });
        player.isDrawing = true;
      } else if (targetCellState === CLAIMED) {
        if (player.isDrawing) {
          resolveCapture();
        }
      }
    }

    function updateEnemies() {
      if (gameState !== 'PLAYING') return;

      // 占領 > 60% 後殘局加速
      let rageMultiplier = 1.0;
      if (currentStageIndex >= 5 && currentPct > 60) {
        rageMultiplier = 1.0 + (currentPct - 60) * 0.015;
      }

      for (const en of enemies) {
        en.timer += 1;

        if (en.type === 'jitter' && en.timer % 55 === 0) {
          const currentSpeed = Math.hypot(en.vx, en.vy);
          const currentAngle = Math.atan2(en.vy, en.vx);
          const newAngle = currentAngle + (Math.random() - 0.5) * 1.3;
          en.vx = Math.cos(newAngle) * currentSpeed;
          en.vy = Math.sin(newAngle) * currentSpeed;
        } else if (en.type === 'hunter' && player.isDrawing) {
          const targetAngle = Math.atan2(player.y - en.y, player.x - en.x);
          const currentAngle = Math.atan2(en.vy, en.vx);
          let diff = targetAngle - currentAngle;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          
          const turnRate = 0.045;
          const newAngle = currentAngle + Math.sign(diff) * Math.min(Math.abs(diff), turnRate);
          const curSpeed = en.baseSpeed * rageMultiplier;
          en.vx = Math.cos(newAngle) * curSpeed;
          en.vy = Math.sin(newAngle) * curSpeed;
        }

        let stepVx = en.vx * (en.type !== 'hunter' ? rageMultiplier : 1.0);
        let stepVy = en.vy * (en.type !== 'hunter' ? rageMultiplier : 1.0);

        let nextX = en.x + stepVx;
        let nextY = en.y + stepVy;

        const checkR = Math.floor(nextY);
        const checkC = Math.floor(nextX);

        if (checkC < 0 || checkC >= COLS || grid[Math.floor(en.y)][checkC] === CLAIMED) {
          en.vx *= -1;
          nextX = en.x + en.vx * rageMultiplier;
        }
        if (checkR < 0 || checkR >= ROWS || grid[checkR][Math.floor(en.x)] === CLAIMED) {
          en.vy *= -1;
          nextY = en.y + en.vy * rageMultiplier;
        }

        en.x = nextX;
        en.y = nextY;

        const currentR = Math.floor(en.y);
        const currentC = Math.floor(en.x);

        if (player.isDrawing) {
          if (grid[currentR][currentC] === TRAIL) {
            handleGameOver("正在劃線時，線條被敵人觸碰到了！");
            return;
          }
          const distToPlayer = Math.hypot(en.x - player.x, en.y - player.y);
          if (distToPlayer < (en.radius / CELL_SIZE) + 0.8) {
            handleGameOver("正在劃線時被敵人直接撞擊！");
            return;
          }
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (bgImage.complete && bgImage.naturalWidth > 0) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (gameState !== 'GOODJOB' && gameState !== 'CLEARED') {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const state = grid[r][c];
            if (state === UNCLAIMED) {
              ctx.fillStyle = '#0f172a';
              ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            } else if (state === TRAIL) {
              ctx.fillStyle = '#38bdf8';
              ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }
          }
        }
      }

      if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        for (const en of enemies) {
          ctx.fillStyle = en.color;
          ctx.shadowColor = en.color;
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(en.x * CELL_SIZE, en.y * CELL_SIZE, en.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }

      if (gameState === 'PLAYING') {
        ctx.save();
        ctx.translate(player.x * CELL_SIZE + CELL_SIZE / 2, player.y * CELL_SIZE + CELL_SIZE / 2);
        ctx.rotate(player.angle);

        if (player.isDrawing) {
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 10;
        }

        ctx.font = `${CELL_SIZE * 3.4}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🕷️', 0, 0);
        ctx.restore();
      }
    }

    function gameLoop(timestamp) {
      if (gameState === 'PLAYING') {
        const dt = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        timeLeft -= dt;
        if (timeLeft <= 0) {
          timeLeft = 0;
          updateDisplayScore();
          handleGameOver("時間耗盡，挑戰失敗！");
          return;
        }
        updateDisplayScore();
      } else {
        lastTimestamp = timestamp;
      }

      updatePlayer();
      updateEnemies();
      render();
      requestAnimationFrame(gameLoop);
    }

    restartEntireGame();
    requestAnimationFrame(gameLoop);
  </script>
