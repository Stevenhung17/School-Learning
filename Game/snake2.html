<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>等級壓制貪吃蛇大亂鬥 - Level Snake Arena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0d1117;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        canvas#gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD Overlay */
        .hud {
            position: absolute;
            pointer-events: none;
            z-index: 10;
        }

        /* Top HUD */
        #top-hud {
            top: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 20px;
        }
        .hud-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        /* Player Stats Card */
        #player-card {
            min-width: 220px;
        }
        .player-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .level-badge {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }
        .score-text {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
        }
        .score-val {
            color: #facc15;
            font-size: 15px;
            font-weight: 700;
        }
        .exp-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        #exp-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #06b6d4, #3b82f6);
            transition: width 0.15s ease-out;
            box-shadow: 0 0 8px #06b6d4;
        }

        /* Timer HUD */
        #timer-card {
            text-align: center;
            padding: 8px 24px;
        }
        #timer-text {
            font-size: 26px;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            color: #38bdf8;
            letter-spacing: 1px;
        }
        .timer-warning {
            color: #ef4444 !important;
            animation: pulse 0.8s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        /* Leaderboard */
        #leaderboard {
            min-width: 190px;
        }
        .lb-title {
            font-size: 12px;
            font-weight: 800;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 2px 0;
            color: #94a3b8;
        }
        .lb-item.is-player {
            color: #38bdf8;
            font-weight: 700;
        }
        .lb-rank {
            width: 18px;
            font-weight: bold;
        }
        .lb-name {
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 8px;
        }
        .lb-level {
            font-weight: 700;
            color: #facc15;
        }

        /* Bottom Buff Bar */
        #buff-container {
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 12px;
        }
        .buff-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(10px);
        }
        .buff-icon.active {
            opacity: 1;
            transform: translateY(0);
        }
        .buff-icon .icon {
            font-size: 22px;
            margin-bottom: 2px;
        }
        .buff-time {
            font-size: 11px;
            color: #38bdf8;
        }

        /* Minimap */
        #minimap-container {
            bottom: 20px;
            right: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            background: rgba(15, 23, 42, 0.7);
        }
        #minimap {
            display: block;
            width: 130px;
            height: 130px;
        }

        /* Boost Button */
        #boost-btn {
            position: absolute;
            bottom: 30px;
            right: 170px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, #f59e0b, #d97706);
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
            color: white;
            font-weight: 900;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            pointer-events: auto;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.1s;
        }
        #boost-btn:active {
            transform: scale(0.92);
        }

        /* Screen Alerts */
        #alert-banner {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(220, 38, 38, 0.9);
            border: 2px solid #f87171;
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 30;
            text-align: center;
        }
        #alert-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Modals */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 12, 22, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .modal-box {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .modal-desc {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .rules-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            text-align: left;
            margin-bottom: 25px;
            font-size: 12px;
        }
        .rule-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .rule-card span {
            font-weight: bold;
            color: #facc15;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
            transition: transform 0.1s, box-shadow 0.2s;
            width: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.9);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }

        /* Result stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 6px;
            border-radius: 12px;
        }
        .stat-label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 800;
            color: #38bdf8;
        }

        @media (max-width: 600px) {
            #top-hud { padding: 0 10px; }
            #player-card { min-width: 150px; padding: 8px 10px; }
            #leaderboard { display: none; }
            #minimap-container { width: 90px; height: 90px; }
            #minimap { width: 90px; height: 90px; }
            #boost-btn { right: 115px; width: 60px; height: 60px; font-size: 11px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Top HUD -->
    <div id="top-hud" class="hud">
        <div id="player-card" class="hud-card">
            <div class="player-info-row">
                <span id="player-level-badge" class="level-badge">Lv. 1</span>
                <span class="score-text">擊殺: <span id="player-kills" class="score-val">0</span></span>
            </div>
            <div class="exp-bar-container">
                <div id="exp-bar-fill"></div>
            </div>
        </div>

        <div id="timer-card" class="hud-card">
            <div id="timer-text">01:30</div>
        </div>

        <div id="leaderboard" class="hud-card">
            <div class="lb-title">🏆 競技場即時排行</div>
            <div id="lb-list"></div>
        </div>
    </div>

    <!-- Alert banner -->
    <div id="alert-banner">⚠️ 警告：巨型首領蛇降臨！</div>

    <!-- Buff indicators -->
    <div id="buff-container" class="hud">
        <div id="buff-magnet" class="buff-icon">
            <span class="icon">🧲</span>
            <span class="buff-time">0s</span>
        </div>
        <div id="buff-shield" class="buff-icon">
            <span class="icon">🛡️</span>
            <span class="buff-time">0s</span>
        </div>
        <div id="buff-boost" class="buff-icon">
            <span class="icon">⚡</span>
            <span class="buff-time">0s</span>
        </div>
    </div>

    <!-- Boost button -->
    <div id="boost-btn">
        <span>⚡</span>
        <span>衝刺</span>
    </div>

    <!-- Minimap -->
    <div id="minimap-container" class="hud">
        <canvas id="minimap" width="130" height="130"></canvas>
    </div>

    <!-- Start Modal -->
    <div id="start-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">等級壓制貪吃蛇</div>
            <p class="modal-desc">精確部位判定機制！被截斷後殘存的身軀可透過進食重新生長！</p>
            <div class="rules-grid">
                <div class="rule-card">
                    <span>⚔️ 同等碰撞：</span>同等級碰撞互彈開，勢均力敵。
                </div>
                <div class="rule-card">
                    <span>🛡️ 小撞大身：</span>小頭撞大身被彈開，不會出局。
                </div>
                <div class="rule-card">
                    <span>✂️ 截斷與再生：</span>大撞小身直接截斷！殘留前半段吃光點可<b>再生變長</b>。
                </div>
                <div class="rule-card">
                    <span>💀 頭部對決：</span>大頭撞小頭直接秒殺吞食淘汰！
                </div>
            </div>
            <button id="start-btn" class="btn-primary">開始對決 (90s)</button>
        </div>
    </div>

    <!-- Game Over / Victory Modal -->
    <div id="gameover-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div id="gameover-title" class="modal-title">對局結束</div>
            <p id="gameover-desc" class="modal-desc">你在競技場中的輝煌戰績</p>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">最終排名</div>
                    <div id="final-rank" class="stat-value">#1</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">最高等級</div>
                    <div id="final-level" class="stat-value">Lv.15</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">淘汰數</div>
                    <div id="final-kills" class="stat-value">8</div>
                </div>
            </div>
            <button id="restart-btn" class="btn-primary">再戰一局</button>
        </div>
    </div>
</div>

<script>
/**
 * Audio Synthesizer
 */
class SoundEngine {
    constructor() {
        this.ctx = null;
    }
    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }
    playEat() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(480, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(960, this.ctx.currentTime + 0.07);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.07);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.07);
    }
    playBounce() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
    }
    playCut() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
    }
    playKill() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    }
    playLevelUp() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, now + i * 0.07);
            gain.gain.setValueAtTime(0.08, now + i * 0.07);
            gain.gain.linearRampToValueAtTime(0, now + i * 0.07 + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.07);
            osc.stop(now + i * 0.07 + 0.12);
        });
    }
    playItem() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(1200, this.ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
    }
}
const sounds = new SoundEngine();

/**
 * Constants & Config
 */
const WORLD_SIZE = 3600;
const MATCH_DURATION = 90;
const BASE_SPEED = 3.5;
const BOOST_SPEED = 6.2;
const FOOD_COUNT = 450;
const ITEM_COUNT = 16;
const AI_COUNT = 15;

const ITEM_TYPES = {
    MAGNET: { name: '🧲 磁鐵', icon: '🧲', color: '#38bdf8', duration: 7 },
    SHIELD: { name: '🛡️ 護盾', icon: '🛡️', color: '#fbbf24', duration: 6 },
    BOOST:  { name: '⚡ 加速', icon: '⚡', color: '#ec4899', duration: 5 }
};

const BOT_NAMES = [
    "狂暴獵手", "影之毒牙", "嗜血龍皇", "黃金巨蟒", "虛空行者", 
    "戰神阿瑞斯", "星空幻影", "爆裂疾風", "雷霆蜥蜴", "深海巨妖",
    "暗黑破壞神", "極速衝刺王", "獵夢者", "無敵破壞王", "紅蓮之翼"
];

const LEVEL_COLORS = [
    { max: 5,  badge: 'linear-gradient(135deg, #06b6d4, #3b82f6)', head: '#06b6d4', body: '#0891b2' },
    { max: 10, badge: 'linear-gradient(135deg, #10b981, #059669)', head: '#10b981', body: '#059669' },
    { max: 15, badge: 'linear-gradient(135deg, #8b5cf6, #6d28d9)', head: '#8b5cf6', body: '#6d28d9' },
    { max: 24, badge: 'linear-gradient(135deg, #f59e0b, #d97706)', head: '#f59e0b', body: '#d97706' },
    { max: 999, badge: 'linear-gradient(135deg, #ef4444, #b91c1c)', head: '#ef4444', body: '#b91c1c' }
];

function getLevelTheme(level) {
    for (let c of LEVEL_COLORS) {
        if (level <= c.max) return c;
    }
    return LEVEL_COLORS[LEVEL_COLORS.length - 1];
}

/**
 * Snake Class with Dynamic Growth & Truncation
 */
class Snake {
    constructor(x, y, name, isPlayer = false, isBoss = false) {
        this.x = x;
        this.y = y;
        this.name = name;
        this.isPlayer = isPlayer;
        this.isBoss = isBoss;

        this.level = isBoss ? 25 : (isPlayer ? 1 : Math.floor(Math.random() * 4) + 1);
        this.exp = 0;
        this.maxExp = this.calcMaxExp(this.level);
        this.kills = 0;
        this.alive = true;

        this.angle = Math.random() * Math.PI * 2;
        this.targetAngle = this.angle;
        this.turnSpeed = 0.13;

        this.isManualBoosting = false;
        this.shieldTimer = 0;
        this.magnetTimer = 0;
        this.boostTimer = 0;
        this.bounceLockTimer = 0;

        // Dynamic length tracking
        this.targetLength = isBoss ? 60 : (14 + this.level * 4);
        this.body = [];
        this.initBody();

        this.aiChangeDirTimer = 0;
    }

    calcMaxExp(level) {
        return Math.floor(12 + level * 8 + Math.pow(level, 1.25) * 3);
    }

    getRadius() {
        if (this.isBoss) return 38;
        return 14 + Math.min(this.level * 0.9, 28);
    }

    initBody() {
        const len = Math.floor(this.targetLength);
        this.body = [];
        for (let i = 0; i < len; i++) {
            this.body.push({ x: this.x - i * 8, y: this.y });
        }
    }

    getSpeed() {
        let speed = BASE_SPEED;
        if (this.boostTimer > 0 || this.isManualBoosting) {
            speed = BOOST_SPEED;
        }
        if (this.isBoss) speed *= 0.92;
        return speed;
    }

    // Dynamic Growth when eating food or exp
    addExp(amount) {
        this.exp += amount;
        
        // Every exp point extends target body length (Regrowth & continuous growth!)
        this.targetLength += amount * 0.35;

        while (this.exp >= this.maxExp) {
            this.exp -= this.maxExp;
            this.level++;
            this.maxExp = this.calcMaxExp(this.level);
            this.targetLength += 3.5; // Bonus segments on level up

            if (this.isPlayer) {
                sounds.playLevelUp();
                createFloatingText(this.x, this.y - 40, `LEVEL UP! Lv.${this.level}`, '#facc15', 24);
                createParticles(this.x, this.y, 25, '#facc15');
            }
        }
    }

    // Truncate snake from hitIndex to tail, lock current length, allowing regrowth
    truncate(hitIndex, attacker) {
        if (hitIndex < 2) {
            // Cut too close to the head: total elimination
            eliminateSnake(this, attacker);
            return;
        }

        // Sever the body from hitIndex
        const severedSegments = this.body.splice(hitIndex);
        
        // Target length is now locked to the truncated length (stops automatic instant bounce-back)
        this.targetLength = this.body.length;

        // Severed parts burst into high-yield remnant food
        severedSegments.forEach((seg, idx) => {
            if (idx % 2 === 0) {
                spawnFood(2, true, seg);
            }
        });

        sounds.playCut();
        createParticles(this.body[this.body.length - 1].x, this.body[this.body.length - 1].y, 22, '#f59e0b', 12);
        createFloatingText(this.x, this.y - 30, `✂️ 身體被截斷！`, '#ef4444', 18);

        if (this.isPlayer) {
            showAlert(`⚠️ 身體被截斷！失去 ${severedSegments.length} 節身軀，快吃光點重新生長！`, 'rgba(239, 68, 68, 0.95)');
        }
    }

    // Physical bounce response
    bounceAway(fromX, fromY, force = 30) {
        const bAngle = Math.atan2(this.y - fromY, this.x - fromX);
        this.x += Math.cos(bAngle) * force;
        this.y += Math.sin(bAngle) * force;
        this.angle = bAngle;
        this.targetAngle = bAngle;
        this.bounceLockTimer = 0.35;
        createParticles(this.x, this.y, 8, '#facc15', 6);
        sounds.playBounce();
    }

    update(dt) {
        if (!this.alive) return;

        if (this.shieldTimer > 0) this.shieldTimer -= dt;
        if (this.magnetTimer > 0) this.magnetTimer -= dt;
        if (this.boostTimer > 0) this.boostTimer -= dt;
        if (this.bounceLockTimer > 0) this.bounceLockTimer -= dt;

        // Turn towards target angle
        if (this.bounceLockTimer <= 0) {
            let diff = this.targetAngle - this.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            this.angle += diff * this.turnSpeed;
        }

        const currentSpeed = this.getSpeed();
        this.x += Math.cos(this.angle) * currentSpeed;
        this.y += Math.sin(this.angle) * currentSpeed;

        // Boundary constraint
        const margin = 50;
        if (this.x < margin) { this.x = margin; this.targetAngle = 0; }
        if (this.x > WORLD_SIZE - margin) { this.x = WORLD_SIZE - margin; this.targetAngle = Math.PI; }
        if (this.y < margin) { this.y = margin; this.targetAngle = Math.PI / 2; }
        if (this.y > WORLD_SIZE - margin) { this.y = WORLD_SIZE - margin; this.targetAngle = -Math.PI / 2; }

        // Dynamic Growth & Tail adjustment
        const requiredSegments = Math.floor(this.targetLength);
        if (this.body.length < requiredSegments) {
            const last = this.body[this.body.length - 1] || { x: this.x, y: this.y };
            this.body.push({ x: last.x, y: last.y });
        }

        // Update body segments following head
        const segSpacing = Math.max(6, this.getRadius() * 0.55);
        let prevX = this.x;
        let prevY = this.y;

        for (let i = 0; i < this.body.length; i++) {
            let seg = this.body[i];
            let dx = prevX - seg.x;
            let dy = prevY - seg.y;
            let dist = Math.hypot(dx, dy);
            if (dist > segSpacing) {
                seg.x = prevX - (dx / dist) * segSpacing;
                seg.y = prevY - (dy / dist) * segSpacing;
            }
            prevX = seg.x;
            prevY = seg.y;
        }

        if ((this.boostTimer > 0 || this.isManualBoosting) && Math.random() < 0.3) {
            createParticles(this.x, this.y, 1, '#38bdf8', 12);
        }
    }

    aiUpdate(snakes, foods, items, dt) {
        if (this.isPlayer || !this.alive || this.bounceLockTimer > 0) return;

        this.aiChangeDirTimer -= dt;

        if (this.isBoss) {
            let player = snakes.find(s => s.isPlayer && s.alive);
            if (player) {
                this.targetAngle = Math.atan2(player.y - this.y, player.x - this.x);
            }
            return;
        }

        if (this.aiChangeDirTimer <= 0) {
            this.aiChangeDirTimer = 0.4 + Math.random() * 0.6;

            let nearestThreat = null;
            let threatDist = 260;
            let nearestPrey = null;
            let preyDist = 300;

            for (let other of snakes) {
                if (other === this || !other.alive) continue;
                let d = Math.hypot(other.x - this.x, other.y - this.y);

                if (other.level > this.level && !this.shieldTimer) {
                    if (d < threatDist) {
                        threatDist = d;
                        nearestThreat = other;
                    }
                } else if (this.level > other.level || this.shieldTimer > 0) {
                    if (d < preyDist) {
                        preyDist = d;
                        nearestPrey = other;
                    }
                }
            }

            if (nearestThreat) {
                this.targetAngle = Math.atan2(this.y - nearestThreat.y, this.x - nearestThreat.x);
                this.isManualBoosting = (threatDist < 160);
                return;
            }

            if (nearestPrey) {
                this.targetAngle = Math.atan2(nearestPrey.y - this.y, nearestPrey.x - this.x);
                this.isManualBoosting = (preyDist < 200 && Math.random() < 0.5);
                return;
            }

            this.isManualBoosting = false;

            // Pick items
            let nearestItem = null;
            let itemDist = 300;
            for (let item of items) {
                let d = Math.hypot(item.x - this.x, item.y - this.y);
                if (d < itemDist) {
                    itemDist = d;
                    nearestItem = item;
                }
            }
            if (nearestItem) {
                this.targetAngle = Math.atan2(nearestItem.y - this.y, nearestItem.x - this.x);
                return;
            }

            // Food & wandering
            let nearestFood = null;
            let fDist = 180;
            for (let f of foods) {
                let d = Math.hypot(f.x - this.x, f.y - this.y);
                if (d < fDist) {
                    fDist = d;
                    nearestFood = f;
                }
            }
            if (nearestFood) {
                this.targetAngle = Math.atan2(nearestFood.y - this.y, nearestFood.x - this.x);
            } else {
                this.targetAngle += (Math.random() - 0.5) * 1.5;
            }
        }
    }

    draw(ctx, camera) {
        if (!this.alive) return;

        const rad = this.getRadius();
        const theme = getLevelTheme(this.level);

        // Body
        for (let i = this.body.length - 1; i >= 0; i--) {
            const seg = this.body[i];
            const scrX = seg.x - camera.x;
            const scrY = seg.y - camera.y;
            const segRatio = (1 - (i / Math.max(1, this.body.length)) * 0.45);
            const segRad = rad * segRatio;

            ctx.beginPath();
            ctx.arc(scrX, scrY, segRad, 0, Math.PI * 2);
            ctx.fillStyle = this.isBoss ? '#b45309' : (this.isPlayer ? '#2563eb' : theme.body);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(scrX, scrY, segRad * 0.65, 0, Math.PI * 2);
            ctx.fillStyle = this.isBoss ? '#fde047' : (this.isPlayer ? '#60a5fa' : theme.head);
            ctx.fill();
        }

        // Head
        const hScrX = this.x - camera.x;
        const hScrY = this.y - camera.y;

        if (this.shieldTimer > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(hScrX, hScrY, rad * 1.7, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(251, 191, 36, 0.25)';
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.setLineDash([6, 4]);
            ctx.stroke();
            ctx.fill();
            ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(hScrX, hScrY, rad, 0, Math.PI * 2);
        ctx.fillStyle = this.isBoss ? '#f59e0b' : (this.isPlayer ? '#3b82f6' : theme.head);
        ctx.shadowColor = this.isBoss ? '#eab308' : theme.head;
        ctx.shadowBlur = this.isPlayer ? 18 : 8;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Eyes
        const eyeAngle1 = this.angle + 0.65;
        const eyeAngle2 = this.angle - 0.65;
        const eyeDist = rad * 0.7;

        [eyeAngle1, eyeAngle2].forEach(ea => {
            const ex = hScrX + Math.cos(ea) * eyeDist;
            const ey = hScrY + Math.sin(ea) * eyeDist;
            ctx.beginPath();
            ctx.arc(ex, ey, rad * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            const px = ex + Math.cos(this.angle) * (rad * 0.12);
            const py = ey + Math.sin(this.angle) * (rad * 0.12);
            ctx.beginPath();
            ctx.arc(px, py, rad * 0.16, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();
        });

        // Boss Crown
        if (this.isBoss) {
            ctx.font = `${rad * 1.1}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('👑', hScrX, hScrY - rad * 1.4);
        }

        // Floating Level Badge
        const badgeY = hScrY - rad - 20;
        const badgeText = `Lv.${this.level} ${this.name}`;
        
        ctx.font = 'bold 12px sans-serif';
        const textWidth = ctx.measureText(badgeText).width;
        const badgeW = textWidth + 16;
        const badgeH = 22;

        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.beginPath();
        ctx.roundRect(hScrX - badgeW / 2, badgeY - badgeH / 2, badgeW, badgeH, 10);
        ctx.fill();
        ctx.strokeStyle = this.isBoss ? '#f59e0b' : theme.head;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(badgeText, hScrX, badgeY);
    }
}

/**
 * Particles & Floating Texts
 */
let particles = [];
let floatingTexts = [];

function createParticles(x, y, count = 10, color = '#38bdf8', size = 8) {
    for (let i = 0; i < count; i++) {
        const speed = 1 + Math.random() * 4;
        const angle = Math.random() * Math.PI * 2;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color,
            size: size * (0.5 + Math.random() * 0.8),
            life: 1,
            decay: 0.02 + Math.random() * 0.03
        });
    }
}

function createFloatingText(x, y, text, color = '#facc15', size = 16) {
    floatingTexts.push({
        x, y,
        text,
        color,
        size,
        life: 1,
        vy: -1.4
    });
}

/**
 * Game State Setup
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap');
const mmCtx = minimapCanvas.getContext('2d');

let gameRunning = false;
let gameTimeRemaining = MATCH_DURATION;
let bossSpawned = false;

let player = null;
let snakes = [];
let foods = [];
let items = [];
let camera = { x: 0, y: 0 };
let mousePos = { x: 0, y: 0 };

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function spawnFood(count, isRemnant = false, centerPos = null) {
    for (let i = 0; i < count; i++) {
        let x, y;
        if (centerPos) {
            const spread = 20 + Math.random() * 60;
            const a = Math.random() * Math.PI * 2;
            x = Math.max(20, Math.min(WORLD_SIZE - 20, centerPos.x + Math.cos(a) * spread));
            y = Math.max(20, Math.min(WORLD_SIZE - 20, centerPos.y + Math.sin(a) * spread));
        } else {
            x = Math.random() * WORLD_SIZE;
            y = Math.random() * WORLD_SIZE;
        }

        const expValue = isRemnant ? (Math.floor(Math.random() * 15) + 12) : (Math.floor(Math.random() * 3) + 1);
        const radius = isRemnant ? 7 : (2.5 + expValue * 0.8);
        const colors = ['#f43f5e', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b'];
        const color = isRemnant ? '#fde047' : colors[Math.floor(Math.random() * colors.length)];

        foods.push({ x, y, radius, expValue, color, isRemnant });
    }
}

function spawnItem() {
    const types = [ITEM_TYPES.MAGNET, ITEM_TYPES.SHIELD, ITEM_TYPES.BOOST];
    const type = types[Math.floor(Math.random() * types.length)];
    items.push({
        x: Math.random() * (WORLD_SIZE - 200) + 100,
        y: Math.random() * (WORLD_SIZE - 200) + 100,
        type: type,
        radius: 18,
        pulse: 0
    });
}

function spawnBot(isBoss = false) {
    const x = Math.random() * (WORLD_SIZE - 400) + 200;
    const y = Math.random() * (WORLD_SIZE - 400) + 200;
    const name = isBoss ? "⚔️ 巨型泰坦首領" : BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
    const bot = new Snake(x, y, name, false, isBoss);
    snakes.push(bot);
    return bot;
}

function initGame() {
    gameTimeRemaining = MATCH_DURATION;
    bossSpawned = false;
    particles = [];
    floatingTexts = [];
    foods = [];
    items = [];
    snakes = [];

    player = new Snake(WORLD_SIZE / 2, WORLD_SIZE / 2, "你", true);
    snakes.push(player);

    spawnFood(FOOD_COUNT);
    for (let i = 0; i < ITEM_COUNT; i++) spawnItem();
    for (let i = 0; i < AI_COUNT; i++) spawnBot();

    updateUI();
}

let alertTimeout = null;
function showAlert(text, bg = 'rgba(220, 38, 38, 0.95)') {
    const el = document.getElementById('alert-banner');
    el.innerText = text;
    el.style.backgroundColor = bg;
    el.classList.add('show');
    if (alertTimeout) clearTimeout(alertTimeout);
    alertTimeout = setTimeout(() => el.classList.remove('show'), 3500);
}

/**
 * Collision Handling & 4 Rules Execution
 */
function handleCollisions() {
    // 1. Food & Magnet Logic
    const pHead = { x: player.x, y: player.y };
    const pRadius = player.getRadius();
    const magnetRadius = player.magnetTimer > 0 ? 350 : pRadius + 15;

    for (let i = foods.length - 1; i >= 0; i--) {
        const f = foods[i];
        
        if (player.alive) {
            const dx = pHead.x - f.x;
            const dy = pHead.y - f.y;
            const dist = Math.hypot(dx, dy);

            if (dist < magnetRadius) {
                f.x += (dx / dist) * 12;
                f.y += (dy / dist) * 12;
            }
        }

        for (let s of snakes) {
            if (!s.alive) continue;
            const d = Math.hypot(s.x - f.x, s.y - f.y);
            if (d < s.getRadius() + f.radius + 5) {
                s.addExp(f.expValue);
                if (s.isPlayer) sounds.playEat();
                foods.splice(i, 1);
                break;
            }
        }
    }

    if (foods.length < FOOD_COUNT) {
        spawnFood(FOOD_COUNT - foods.length);
    }

    // 2. Item Pickups
    for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.pulse += 0.05;

        for (let s of snakes) {
            if (!s.alive) continue;
            const d = Math.hypot(s.x - it.x, s.y - it.y);
            if (d < s.getRadius() + it.radius) {
                if (it.type === ITEM_TYPES.MAGNET) s.magnetTimer = it.type.duration;
                if (it.type === ITEM_TYPES.SHIELD) s.shieldTimer = it.type.duration;
                if (it.type === ITEM_TYPES.BOOST) s.boostTimer = it.type.duration;

                if (s.isPlayer) {
                    sounds.playItem();
                    showAlert(`獲得道具：${it.type.name}！`, 'rgba(59, 130, 246, 0.95)');
                    createFloatingText(s.x, s.y - 30, `${it.type.name}!`, it.type.color, 20);
                }
                createParticles(it.x, it.y, 20, it.type.color);
                items.splice(i, 1);
                break;
            }
        }
    }

    if (items.length < ITEM_COUNT) {
        spawnItem();
    }

    // 3. Snake vs Snake (Head-on-Head & Head-on-Body Logic)
    for (let i = 0; i < snakes.length; i++) {
        const attacker = snakes[i];
        if (!attacker.alive) continue;

        for (let j = 0; j < snakes.length; j++) {
            if (i === j) continue;
            const defender = snakes[j];
            if (!defender.alive) continue;

            const atkLevel = attacker.shieldTimer > 0 ? 9999 : attacker.level;
            const defLevel = defender.shieldTimer > 0 ? 9999 : defender.level;

            // --- A. Head-to-Head Collision ---
            const headDist = Math.hypot(attacker.x - defender.x, attacker.y - defender.y);
            const headMinDist = (attacker.getRadius() + defender.getRadius()) * 0.9;

            if (headDist < headMinDist) {
                if (attacker.bounceLockTimer > 0 || defender.bounceLockTimer > 0) continue;

                if (atkLevel === defLevel) {
                    // Rule 1: Same level head-on -> Bounce both away
                    attacker.bounceAway(defender.x, defender.y, 28);
                    defender.bounceAway(attacker.x, attacker.y, 28);
                    createFloatingText((attacker.x + defender.x)/2, (attacker.y + defender.y)/2, '勢均力敵 💥', '#cbd5e1', 16);
                } else if (atkLevel > defLevel) {
                    // Rule 4: Higher level head hits lower level head -> Lower level eliminated
                    eliminateSnake(defender, attacker);
                } else {
                    // Rule 4 opposite
                    eliminateSnake(attacker, defender);
                }
                break;
            }

            // --- B. Attacker Head vs Defender Body Collision ---
            let bodyHitIndex = -1;
            const atkRad = attacker.getRadius();
            const defRad = defender.getRadius();

            for (let sIdx = 1; sIdx < defender.body.length; sIdx++) {
                const seg = defender.body[sIdx];
                const d = Math.hypot(attacker.x - seg.x, attacker.y - seg.y);
                if (d < atkRad + defRad * 0.6) {
                    bodyHitIndex = sIdx;
                    break;
                }
            }

            if (bodyHitIndex !== -1) {
                if (attacker.bounceLockTimer > 0) continue;

                const hitSeg = defender.body[bodyHitIndex];

                if (atkLevel === defLevel) {
                    // Rule 1: Same level hits body -> Bounce off
                    attacker.bounceAway(hitSeg.x, hitSeg.y, 24);
                } else if (atkLevel < defLevel) {
                    // Rule 2: Lower level head hits Higher level body -> Bounce off, survives!
                    attacker.bounceAway(hitSeg.x, hitSeg.y, 28);
                    createFloatingText(attacker.x, attacker.y - 20, '防禦反彈 🛡️', '#94a3b8', 14);
                } else {
                    // Rule 3: Higher level head hits Lower level body -> Truncate lower level body!
                    defender.truncate(bodyHitIndex, attacker);
                    attacker.addExp(25);
                    if (attacker.isPlayer) {
                        showAlert(`✂️ 成功截斷 [Lv.${defender.level} ${defender.name}] 的身軀！`, 'rgba(245, 158, 11, 0.95)');
                    }
                }
                break;
            }
        }
    }
}

function eliminateSnake(victim, killer) {
    if (!victim.alive) return;
    victim.alive = false;

    // Drop large exp remnants
    const dropCount = Math.min(25, 8 + victim.level * 2);
    spawnFood(dropCount, true, { x: victim.x, y: victim.y });
    for (let i = 0; i < victim.body.length; i += 2) {
        spawnFood(2, true, victim.body[i]);
    }

    createParticles(victim.x, victim.y, 40, '#ef4444', 14);

    if (killer) {
        killer.kills++;
        killer.addExp(victim.level * 25 + 20);
        if (killer.isPlayer) {
            sounds.playKill();
            showAlert(`⚔️ 正面吞食擊殺 [Lv.${victim.level} ${victim.name}]！`, 'rgba(16, 185, 129, 0.95)');
            createFloatingText(victim.x, victim.y - 20, `+${victim.level * 25} EXP`, '#10b981', 22);
        }
    }

    if (victim.isPlayer) {
        sounds.playKill();
        endGame(false);
    } else {
        if (!victim.isBoss) {
            setTimeout(() => {
                if (gameRunning) spawnBot();
            }, 3000);
        }
    }
}

/**
 * UI & HUD Updates
 */
function updateUI() {
    if (!player) return;

    document.getElementById('player-level-badge').innerText = `Lv. ${player.level}`;
    document.getElementById('player-kills').innerText = player.kills;
    const expRatio = Math.min(100, (player.exp / player.maxExp) * 100);
    document.getElementById('exp-bar-fill').style.width = `${expRatio}%`;

    const mins = Math.floor(gameTimeRemaining / 60);
    const secs = Math.floor(gameTimeRemaining % 60);
    const timerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    const timerEl = document.getElementById('timer-text');
    timerEl.innerText = timerText;
    if (gameTimeRemaining <= 15) {
        timerEl.classList.add('timer-warning');
    } else {
        timerEl.classList.remove('timer-warning');
    }

    const updateBuff = (id, timer) => {
        const el = document.getElementById(id);
        if (timer > 0) {
            el.classList.add('active');
            el.querySelector('.buff-time').innerText = `${Math.ceil(timer)}s`;
        } else {
            el.classList.remove('active');
        }
    };
    updateBuff('buff-magnet', player.magnetTimer);
    updateBuff('buff-shield', player.shieldTimer);
    updateBuff('buff-boost', player.boostTimer);

    const sortedSnakes = [...snakes].filter(s => s.alive).sort((a, b) => (b.level * 1000 + b.exp) - (a.level * 1000 + a.exp));
    const lbContainer = document.getElementById('lb-list');
    lbContainer.innerHTML = '';

    const top5 = sortedSnakes.slice(0, 5);
    top5.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = `lb-item ${s.isPlayer ? 'is-player' : ''}`;
        item.innerHTML = `
            <span class="lb-rank">#${idx + 1}</span>
            <span class="lb-name">${s.name}</span>
            <span class="lb-level">Lv.${s.level}</span>
        `;
        lbContainer.appendChild(item);
    });
}

/**
 * Minimap Rendering
 */
function drawMinimap() {
    mmCtx.clearRect(0, 0, 130, 130);
    const scale = 130 / WORLD_SIZE;

    mmCtx.fillStyle = '#fbbf24';
    items.forEach(it => {
        mmCtx.fillRect(it.x * scale - 1.5, it.y * scale - 1.5, 3, 3);
    });

    snakes.forEach(s => {
        if (!s.alive) return;
        mmCtx.beginPath();
        if (s.isBoss) {
            mmCtx.fillStyle = '#ef4444';
            mmCtx.arc(s.x * scale, s.y * scale, 4, 0, Math.PI * 2);
        } else if (s.isPlayer) {
            mmCtx.fillStyle = '#38bdf8';
            mmCtx.arc(s.x * scale, s.y * scale, 3.5, 0, Math.PI * 2);
        } else {
            mmCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            mmCtx.arc(s.x * scale, s.y * scale, 2, 0, Math.PI * 2);
        }
        mmCtx.fill();
    });
}

/**
 * Main Loop
 */
let lastTime = performance.now();

function gameLoop(now) {
    if (!gameRunning) return;

    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    gameTimeRemaining -= dt;
    if (gameTimeRemaining <= 45 && !bossSpawned) {
        bossSpawned = true;
        spawnBot(true);
        showAlert('⚠️ 警告：巨型首領蛇已降臨！討伐獲得海量經驗！', 'rgba(220, 38, 38, 0.95)');
    }

    if (gameTimeRemaining <= 0) {
        endGame(true);
        return;
    }

    if (player && player.alive) {
        const screenCenterX = canvas.width / 2;
        const screenCenterY = canvas.height / 2;
        if (player.bounceLockTimer <= 0) {
            player.targetAngle = Math.atan2(mousePos.y - screenCenterY, mousePos.x - screenCenterX);
        }
        player.update(dt);
        camera.x = player.x - screenCenterX;
        camera.y = player.y - screenCenterY;
    }

    snakes.forEach(s => {
        if (!s.isPlayer) {
            s.aiUpdate(snakes, foods, items, dt);
            s.update(dt);
        }
    });

    handleCollisions();

    // Render Background
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const gridSize = 60;
    const startX = -(camera.x % gridSize);
    const startY = -(camera.y % gridSize);

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
    ctx.lineWidth = 1;
    for (let x = startX; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = startY; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
    ctx.lineWidth = 4;
    ctx.strokeRect(-camera.x, -camera.y, WORLD_SIZE, WORLD_SIZE);

    // Foods
    foods.forEach(f => {
        const scrX = f.x - camera.x;
        const scrY = f.y - camera.y;
        if (scrX < -20 || scrX > canvas.width + 20 || scrY < -20 || scrY > canvas.height + 20) return;

        ctx.beginPath();
        ctx.arc(scrX, scrY, f.radius, 0, Math.PI * 2);
        ctx.fillStyle = f.color;
        if (f.isRemnant) {
            ctx.shadowColor = f.color;
            ctx.shadowBlur = 10;
        }
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    // Items
    items.forEach(it => {
        const scrX = it.x - camera.x;
        const scrY = it.y - camera.y;
        if (scrX < -40 || scrX > canvas.width + 40 || scrY < -40 || scrY > canvas.height + 40) return;

        const pulseRad = it.radius + Math.sin(it.pulse) * 3;
        ctx.save();
        ctx.beginPath();
        ctx.arc(scrX, scrY, pulseRad, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.strokeStyle = it.type.color;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = it.type.color;
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.stroke();

        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(it.type.icon, scrX, scrY);
        ctx.restore();
    });

    // Snakes
    snakes.forEach(s => s.draw(ctx, camera));

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }
        ctx.beginPath();
        ctx.arc(p.x - camera.x, p.y - camera.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // Floating text
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life -= 0.02;
        if (ft.life <= 0) {
            floatingTexts.splice(i, 1);
            continue;
        }
        ctx.save();
        ctx.font = `bold ${ft.size}px sans-serif`;
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = ft.life;
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x - camera.x, ft.y - camera.y);
        ctx.restore();
    }

    updateUI();
    drawMinimap();

    requestAnimationFrame(gameLoop);
}

function endGame(isTimeUp) {
    gameRunning = false;
    const sortedSnakes = [...snakes].sort((a, b) => (b.level * 1000 + b.exp) - (a.level * 1000 + a.exp));
    const playerRank = sortedSnakes.findIndex(s => s === player) + 1;

    document.getElementById('final-rank').innerText = `#${playerRank}`;
    document.getElementById('final-level').innerText = `Lv.${player.level}`;
    document.getElementById('final-kills').innerText = player.kills;

    const titleEl = document.getElementById('gameover-title');
    const descEl = document.getElementById('gameover-desc');

    if (isTimeUp) {
        if (playerRank === 1) {
            titleEl.innerText = "🏆 榮登王者第一名！";
            descEl.innerText = "你成功制霸競技場，成為至尊蛇王！";
        } else {
            titleEl.innerText = "⏰ 時間到！";
            descEl.innerText = `恭喜榮獲第 ${playerRank} 名！`;
        }
    } else {
        titleEl.innerText = "💀 遭到正面吞食！";
        descEl.innerText = "頭部正面撞上了比你高等級的強者，下次再接再厲！";
    }

    document.getElementById('gameover-modal').classList.remove('hidden');
}

/**
 * Inputs
 */
window.addEventListener('mousemove', (e) => {
    mousePos.x = e.clientX;
    mousePos.y = e.clientY;
});

window.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
        mousePos.x = e.touches[0].clientX;
        mousePos.y = e.touches[0].clientY;
    }
}, { passive: false });

window.addEventListener('touchstart', (e) => {
    if (e.touches.length > 0) {
        mousePos.x = e.touches[0].clientX;
        mousePos.y = e.touches[0].clientY;
    }
}, { passive: false });

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && player) {
        player.isManualBoosting = true;
    }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' && player) {
        player.isManualBoosting = false;
    }
});

const boostBtn = document.getElementById('boost-btn');
const startBoost = (e) => {
    e.preventDefault();
    if (player) player.isManualBoosting = true;
};
const endBoost = (e) => {
    e.preventDefault();
    if (player) player.isManualBoosting = false;
};
boostBtn.addEventListener('mousedown', startBoost);
boostBtn.addEventListener('mouseup', endBoost);
boostBtn.addEventListener('touchstart', startBoost);
boostBtn.addEventListener('touchend', endBoost);

document.getElementById('start-btn').addEventListener('click', () => {
    sounds.init();
    document.getElementById('start-modal').classList.add('hidden');
    initGame();
    gameRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
});

document.getElementById('restart-btn').addEventListener('click', () => {
    document.getElementById('gameover-modal').classList.add('hidden');
    initGame();
    gameRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
});

mousePos = { x: window.innerWidth / 2, y: window.innerHeight / 2 - 50 };
</script>
