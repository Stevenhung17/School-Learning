<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心算高手：指尖九九</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --correct: #22c55e;
      --wrong: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .game-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 420px;
      min-height: 520px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 頂部資訊列 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      min-width: 60px;
    }

    #timer.panic {
      color: var(--wrong);
      font-size: 1.8rem;
      animation: pulse-panic 0.5s infinite alternate;
    }

    @keyframes pulse-panic {
      from { transform: scale(1); text-shadow: 0 0 4px rgba(239, 68, 68, 0.4); }
      to { transform: scale(1.15); text-shadow: 0 0 16px rgba(239, 68, 68, 0.9); }
    }

    .combo-box {
      min-width: 70px;
    }

    #combo-value.pop {
      animation: combo-bounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes combo-bounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); color: var(--warning); }
      100% { transform: scale(1); }
    }

    /* 題目區塊 */
    .question-area {
      margin: 10px 0;
    }

    .formula {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #38bdf8;
    }

    /* 九宮格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 5px;
    }

    .grid-btn {
      background-color: #334155;
      color: var(--text-main);
      font-size: 1.5rem;
      font-weight: 700;
      border: 2px solid transparent;
      border-radius: 12px;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.15s, transform 0.08s, border-color 0.15s;
    }

    .grid-btn:hover:not(:disabled) {
      background-color: var(--accent);
    }

    .grid-btn:active:not(:disabled) {
      transform: scale(0.94);
    }

    .grid-btn:disabled {
      background-color: #1e293b;
      color: #475569;
      border-color: #334155;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .shake {
      animation: shake-anim 0.35s ease-in-out;
      border-color: var(--wrong) !important;
      background-color: rgba(239, 68, 68, 0.2) !important;
    }

    @keyframes shake-anim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* 遮罩面板 */
    .overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.96);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 20;
    }

    .overlay.hidden {
      display: none !important;
    }

    .overlay h2 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: #38bdf8;
    }

    .btn-action {
      background-color: var(--accent);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 12px 32px;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      margin-top: 15px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-action:hover {
      background-color: var(--accent-hover);
    }

    .btn-action:active {
      transform: scale(0.96);
    }

    /* 結算與排行榜 */
    .result-stats {
      width: 100%;
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin: 12px 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      font-size: 0.85rem;
    }

    .result-stats div {
      text-align: left;
      color: var(--text-muted);
    }

    .result-stats span {
      float: right;
      color: var(--text-main);
      font-weight: 600;
    }

    .leaderboard-container {
      width: 100%;
      max-height: 120px;
      overflow-y: auto;
      margin: 8px 0;
      border: 1px solid #334155;
      border-radius: 8px;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 6px;
      text-align: center;
    }

    .leaderboard-table th {
      background-color: #334155;
      color: var(--text-muted);
    }

    .input-row {
      display: flex;
      gap: 8px;
      width: 100%;
      margin: 8px 0;
    }

    .name-input {
      flex: 1;
      padding: 8px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      outline: none;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="header-bar">
    <div class="stat-box">
      <span class="stat-label">時間</span>
      <span id="timer" class="stat-value">60</span>
    </div>
    <div class="stat-box combo-box">
      <span class="stat-label">Combo</span>
      <span id="combo-value" class="stat-value">0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">分數</span>
      <span id="score-value" class="stat-value">0</span>
    </div>
  </div>

  <div class="question-area">
    <div id="formula" class="formula">-- × --</div>
  </div>

  <div id="grid" class="grid">
    <!-- 預設生成 9 個占位按鈕維持卡片高度 -->
    <button type="button" class="grid-btn">?</button>
    <button type="button" class="grid-btn">?</button>
    <button type="button" class="grid-btn">?</button>
    <button type="button" class="grid-btn">?</button>
    <button type="button" class="grid-btn">?</button>
    <button type="button" class="grid-btn">?</button>
    <button type="button" class="grid-btn">?</button>
    <button type="button" class="grid-btn">?</button>
    <button type="button" class="grid-btn">?</button>
  </div>

  <!-- 開始畫面 -->
  <div id="start-overlay" class="overlay">
    <h2>心算高手：指尖九九</h2>
    <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.95rem; line-height: 1.6;">
      共 60 秒極速挑戰！<br>
      前 40 秒基礎題庫，最後 20 秒極限相近干擾。<br>
      連續答對享加分，答錯重置 Combo。
    </p>
    <button type="button" id="start-btn" class="btn-action">開始挑戰</button>
  </div>

  <!-- 結算畫面 -->
  <div id="result-overlay" class="overlay hidden">
    <h2>挑戰結束</h2>
    <div class="result-stats">
      <div>最終分數：<span id="res-score">0</span></div>
      <div>最高連擊：<span id="res-combo">0</span></div>
      <div>正確題數：<span id="res-solved">0</span></div>
      <div>答題準確率：<span id="res-acc">0%</span></div>
    </div>

    <div class="input-row" id="save-score-area">
      <input type="text" id="player-name" class="name-input" placeholder="輸入暱稱" maxlength="8">
      <button type="button" id="save-btn" class="btn-action" style="margin: 0; padding: 8px 16px; font-size: 0.9rem;">紀錄</button>
    </div>

    <div class="leaderboard-container">
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>名次</th>
            <th>玩家</th>
            <th>分數</th>
            <th>準確率</th>
            <th>Combo</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>

    <button type="button" id="restart-btn" class="btn-action">再玩一次</button>
  </div>
</div>

<script>
  // 乘積池 (1x1 ~ 9x9)
  const ALL_PRODUCTS = (() => {
    const set = new Set();
    for (let i = 1; i <= 9; i++) {
      for (let j = 1; j <= 9; j++) {
        set.add(i * j);
      }
    }
    return Array.from(set);
  })();

  // 具備完整容錯的音效合成器
  class SoundEffects {
    constructor() {
      this.ctx = null;
      this.enabled = true;
    }

    init() {
      try {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      } catch (err) {
        console.warn('音訊初始化失敗，切換為靜音模式：', err);
        this.enabled = false;
      }
    }

    playCorrect() {
      if (!this.ctx || !this.enabled) return;
      try {
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      } catch (e) {}
    }

    playWrong() {
      if (!this.ctx || !this.enabled) return;
      try {
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.18);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      } catch (e) {}
    }

    playTick() {
      if (!this.ctx || !this.enabled) return;
      try {
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      } catch (e) {}
    }
  }

  const sfx = new SoundEffects();

  const GAME_DURATION = 60;
  let timeLeft = GAME_DURATION;
  let timerId = null;

  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let correctClicks = 0;
  let totalClicks = 0;

  let currentA = 0;
  let currentB = 0;
  let currentAnswer = 0;

  const leaderboard = [];

  const timerEl = document.getElementById('timer');
  const comboEl = document.getElementById('combo-value');
  const scoreEl = document.getElementById('score-value');
  const formulaEl = document.getElementById('formula');
  const gridEl = document.getElementById('grid');

  const startOverlay = document.getElementById('start-overlay');
  const resultOverlay = document.getElementById('result-overlay');
  const startBtn = document.getElementById('start-btn');
  const restartBtn = document.getElementById('restart-btn');
  const saveBtn = document.getElementById('save-btn');
  const playerNameInput = document.getElementById('player-name');
  const saveScoreArea = document.getElementById('save-score-area');
  const leaderboardBody = document.getElementById('leaderboard-body');

  const resScore = document.getElementById('res-score');
  const resCombo = document.getElementById('res-combo');
  const resSolved = document.getElementById('res-solved');
  const resAcc = document.getElementById('res-acc');

  startBtn.addEventListener('click', () => {
    sfx.init();
    startGame();
  });

  restartBtn.addEventListener('click', () => {
    resultOverlay.classList.add('hidden');
    startGame();
  });

  saveBtn.addEventListener('click', () => {
    const name = playerNameInput.value.trim() || '匿名玩家';
    const acc = totalClicks > 0 ? (correctClicks / totalClicks) * 100 : 0;
    
    leaderboard.push({ name, score, accuracy: acc, maxCombo });

    leaderboard.sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      if (b.accuracy !== a.accuracy) return b.accuracy - a.accuracy;
      return b.maxCombo - a.maxCombo;
    });

    renderLeaderboard();
    saveScoreArea.style.display = 'none';
  });

  function startGame() {
    timeLeft = GAME_DURATION;
    score = 0;
    combo = 0;
    maxCombo = 0;
    correctClicks = 0;
    totalClicks = 0;

    scoreEl.textContent = score;
    comboEl.textContent = combo;
    timerEl.textContent = timeLeft;
    timerEl.classList.remove('panic');

    startOverlay.classList.add('hidden');
    resultOverlay.classList.add('hidden');
    saveScoreArea.style.display = 'flex';
    playerNameInput.value = '';

    generateQuestion();

    if (timerId) clearInterval(timerId);
    timerId = setInterval(tick, 1000);
  }

  function tick() {
    timeLeft--;
    timerEl.textContent = timeLeft;

    if (timeLeft <= 10 && timeLeft > 0) {
      timerEl.classList.add('panic');
      sfx.playTick();
    }

    if (timeLeft <= 0) {
      endGame();
    }
  }

  function generateQuestion() {
    currentA = Math.floor(Math.random() * 9) + 1;
    currentB = Math.floor(Math.random() * 9) + 1;
    currentAnswer = currentA * currentB;

    formulaEl.textContent = `${currentA} × ${currentB}`;

    const distractorCandidates = ALL_PRODUCTS.filter(p => p !== currentAnswer);
    let chosenDistractors = [];

    if (timeLeft > 20) {
      distractorCandidates.sort(() => Math.random() - 0.5);
      chosenDistractors = distractorCandidates.slice(0, 8);
    } else {
      distractorCandidates.sort((a, b) => Math.abs(a - currentAnswer) - Math.abs(b - currentAnswer));
      const pool = distractorCandidates.slice(0, 14).sort(() => Math.random() - 0.5);
      chosenDistractors = pool.slice(0, 8);
    }

    const options = [currentAnswer, ...chosenDistractors].sort(() => Math.random() - 0.5);

    gridEl.innerHTML = '';
    options.forEach(val => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'grid-btn';
      btn.textContent = val;
      btn.addEventListener('click', () => handleChoice(val, btn));
      gridEl.appendChild(btn);
    });
  }

  function handleChoice(selectedValue, btnElement) {
    totalClicks++;

    if (selectedValue === currentAnswer) {
      sfx.playCorrect();
      combo++;
      if (combo > maxCombo) maxCombo = combo;

      score += 10 + (combo - 1);
      correctClicks++;
      scoreEl.textContent = score;

      comboEl.textContent = combo;
      comboEl.classList.remove('pop');
      void comboEl.offsetWidth;
      comboEl.classList.add('pop');

      generateQuestion();
    } else {
      sfx.playWrong();
      combo = 0;
      comboEl.textContent = combo;

      btnElement.disabled = true;
      btnElement.classList.add('shake');
    }
  }

  function endGame() {
    clearInterval(timerId);
    timerId = null;

    const acc = totalClicks > 0 ? ((correctClicks / totalClicks) * 100).toFixed(1) : 0;

    resScore.textContent = score;
    resCombo.textContent = maxCombo;
    resSolved.textContent = correctClicks;
    resAcc.textContent = `${acc}%`;

    renderLeaderboard();
    resultOverlay.classList.remove('hidden');
  }

  function renderLeaderboard() {
    leaderboardBody.innerHTML = '';
    if (leaderboard.length === 0) {
      leaderboardBody.innerHTML = '<tr><td colspan="5" style="color: #64748b;">暫無排行紀錄</td></tr>';
      return;
    }

    leaderboard.slice(0, 5).forEach((entry, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>#${idx + 1}</td>
        <td>${escapeHtml(entry.name)}</td>
        <td style="color: #38bdf8; font-weight: bold;">${entry.score}</td>
        <td>${entry.accuracy.toFixed(1)}%</td>
        <td>${entry.maxCombo}</td>
      `;
      leaderboardBody.appendChild(tr);
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>'"]/g, tag => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[tag] || tag));
  }
</script>

</body>
</html>
